<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Paid Ads Weekly Read</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f5f7;
  --card: #fff;
  --text: #1a1d21;
  --muted: #6b7280;
  --line: #e5e7eb;
  --good: #15803d;
  --good-bg: #f0fdf4;
  --warn: #b45309;
  --warn-bg: #fffbeb;
  --bad: #dc2626;
  --bad-bg: #fef2f2;
  --accent: #111;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "DM Sans", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  padding: 1.5rem;
  max-width: 1100px;
  margin: 0 auto;
}
header {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: flex-end;
  gap: 1rem;
  margin-bottom: 1.5rem;
  padding-bottom: 1rem;
  border-bottom: 3px solid var(--accent);
}
.timestamp-bar {
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem 1rem;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0.55rem 0.85rem;
  margin-bottom: 1rem;
  font-size: 0.8rem;
}
.timestamp-bar strong { font-weight: 700; }
.timestamp-live { color: var(--muted); }
.timestamp-live.fresh { color: var(--good); }
.timestamp-live.stale { color: var(--warn); }
.window-banner {
  width: 100%;
  background: var(--warn-bg);
  border: 1px solid #fcd34d;
  color: var(--warn);
  border-radius: 8px;
  padding: 0.55rem 0.85rem;
  margin-bottom: 1rem;
  font-size: 0.8rem;
}
.window-banner strong { color: var(--text); }
.refresh-btn {
  font-family: "DM Sans", system-ui, sans-serif;
  font-size: 0.75rem;
  font-weight: 600;
  padding: 0.35rem 0.75rem;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--accent);
  color: #fff;
  cursor: pointer;
}
.refresh-btn:hover { opacity: 0.9; }
.refresh-btn:disabled { opacity: 0.5; cursor: wait; }
.key-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 0.5rem;
  margin-bottom: 1.5rem;
}
.key-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0.65rem 0.75rem;
  font-size: 0.78rem;
}
.key-card strong { display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.25rem; }
.section-hint {
  font-size: 0.78rem;
  color: var(--muted);
  margin: -0.35rem 0 0.65rem;
  line-height: 1.4;
}
.glossary-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem 1rem;
  font-size: 0.78rem;
  color: var(--muted);
  margin-bottom: 1.25rem;
  padding: 0.65rem 0.85rem;
  background: var(--card);
  border: 1px dashed var(--line);
  border-radius: 8px;
}
.glossary-row span strong { color: var(--text); }
.todo-list { list-style: none; padding: 0; margin: 0; }
.todo-item {
  display: flex;
  gap: 0.65rem;
  align-items: flex-start;
  padding: 0.65rem 0.85rem;
  border-bottom: 1px solid var(--line);
  font-size: 0.875rem;
  background: var(--card);
}
.todo-item:first-child { border-radius: 8px 8px 0 0; }
.todo-item:last-child { border-bottom: none; border-radius: 0 0 8px 8px; }
.todo-box {
  width: 1rem;
  height: 1rem;
  border: 2px solid var(--line);
  border-radius: 3px;
  flex-shrink: 0;
  margin-top: 0.15rem;
}
.todo-item.watch .todo-box { border-color: var(--warn); }
.todo-meta { font-size: 0.75rem; color: var(--muted); margin-top: 0.2rem; }
.todo-wrap { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 1.5rem; }
.todo-simple-list { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.5rem; }
.todo-simple-item {
  display: flex;
  gap: 0.65rem;
  align-items: flex-start;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0.7rem 0.8rem;
}
.todo-num {
  flex-shrink: 0;
  width: 1.35rem;
  height: 1.35rem;
  border-radius: 999px;
  background: #111;
  color: #fff;
  font-size: 0.72rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 0.05rem;
}
.todo-simple-body { flex: 1; min-width: 0; }
.todo-simple-action {
  font-size: 0.88rem;
  font-weight: 600;
  line-height: 1.35;
}
.todo-simple-detail {
  font-size: 0.78rem;
  color: var(--muted);
  margin-top: 0.2rem;
  line-height: 1.35;
}
.todo-simple-meta {
  font-size: 0.72rem;
  color: var(--muted);
  margin-top: 0.3rem;
}
.todo-tag {
  display: inline-block;
  font-size: 0.62rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 0.12rem 0.4rem;
  border-radius: 4px;
  margin-right: 0.35rem;
  vertical-align: 0.05em;
}
.todo-tag.do { background: var(--good-bg); color: var(--good); }
.todo-tag.hold { background: var(--warn-bg); color: var(--warn); }
.todo-tag.watch { background: #eff6ff; color: #1d4ed8; }
details.key-details { margin-bottom: 1.25rem; }
details.key-details summary {
  cursor: pointer;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 0.5rem;
}
.sub { color: var(--muted); font-size: 0.75rem; }
.sub { color: var(--muted); font-size: 0.875rem; margin-top: 0.25rem; }
.badge {
  font-size: 0.75rem;
  font-weight: 600;
  padding: 0.35rem 0.65rem;
  border-radius: 999px;
  background: var(--card);
  border: 1px solid var(--line);
}
.badge.ok { border-color: #86efac; color: var(--good); background: var(--good-bg); }
.badge.partial { border-color: #fcd34d; color: var(--warn); background: var(--warn-bg); }
.quality-note {
  font-size: 0.82rem;
  color: var(--muted);
  background: var(--warn-bg);
  border: 1px solid #fcd34d;
  border-radius: 8px;
  padding: 0.55rem 0.85rem;
  margin: -0.35rem 0 0.85rem;
  line-height: 1.4;
}
.quality-note strong { color: var(--text); font-weight: 600; }
.kpi-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 0.75rem;
  margin-bottom: 1.5rem;
}
.kpi {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 1rem;
  text-align: center;
}
.kpi .val { font-size: 1.5rem; font-weight: 700; }
.kpi .lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 0.2rem; }
h1 { font-size: 1.5rem; font-weight: 700; }
h2 {
  font-size: 1rem;
  font-weight: 700;
  text-transform: none;
  letter-spacing: 0;
  color: var(--text);
  margin-bottom: 0.65rem;
}
.simple-lede {
  font-size: 1rem;
  line-height: 1.6;
  color: var(--text);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 1rem 1.15rem;
}
.simple-lede li { margin: 0.45rem 0; }
.hero-sales {
  background: var(--accent);
  color: #fff;
  border-radius: 12px;
  padding: 1.1rem 1.25rem;
  margin-bottom: 0.75rem;
  text-align: center;
}
.hero-sales .hero-label {
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  opacity: 0.85;
  margin-bottom: 0.35rem;
}
.hero-sales .hero-val {
  font-size: 2.25rem;
  font-weight: 700;
  line-height: 1.1;
}
.hero-sales .hero-sub {
  font-size: 0.85rem;
  opacity: 0.9;
  margin-top: 0.4rem;
}
.shopify-total-block {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--line);
  border-left: 4px solid var(--accent);
  border-radius: 12px;
  padding: 1.15rem 1.25rem;
  margin-bottom: 0.85rem;
}
.shopify-total-block h2 {
  color: var(--text);
  font-size: 0.95rem;
  margin-bottom: 0.25rem;
}
.shopify-total-block .section-hint {
  color: var(--muted);
  margin-bottom: 0.85rem;
}
.shopify-total-grid {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 1rem;
  align-items: center;
}
.shopify-total-val {
  font-size: 2.5rem;
  font-weight: 700;
  line-height: 1.05;
}
.shopify-total-label {
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  opacity: 0.8;
  margin-top: 0.2rem;
}
.shopify-total-side {
  font-size: 0.88rem;
  line-height: 1.65;
  text-align: right;
  color: var(--muted);
}
.shopify-total-side strong { color: var(--text); }
@media (max-width: 560px) {
  .shopify-total-grid { grid-template-columns: 1fr; }
  .shopify-total-side { text-align: left; }
}
.ads-table-wrap { overflow-x: auto; margin-top: 0.5rem; }
.ads-table-wrap + .ads-table-wrap { margin-top: 1rem; }
.ads-table-wrap h3 {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
  margin-bottom: 0.45rem;
}
.headline-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem;
}
.headline-list li {
  padding: 0.35rem 0.65rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 0.82rem;
  line-height: 1.3;
  background: var(--card);
}
.headline-list li.bite-next {
  border-style: dashed;
  flex: 1 1 100%;
  border-radius: 8px;
  max-width: 100%;
}
.headline-list strong { font-weight: 700; }
.headline-list .bite-call.good { color: var(--good); }
.headline-list .bite-call.watch { color: var(--warn); }
.headline-list .bite-call.pull_back { color: var(--bad); }
.sales-dual {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 0.75rem;
  margin-bottom: 0.75rem;
}
.sales-banner {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 1rem 1.15rem;
  margin-bottom: 0.75rem;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.5rem;
}
.sales-banner .sales-val { font-size: 2rem; font-weight: 700; line-height: 1.1; }
.sales-banner .sales-lbl { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.2rem; }
.sales-banner .sales-sub { font-size: 0.85rem; color: var(--muted); text-align: right; }
.profit-note {
  font-size: 0.78rem;
  color: var(--muted);
  margin: -0.5rem 0 1rem;
  line-height: 1.45;
}
.glance-card.highlight {
  border-color: var(--accent);
  background: #fafafa;
}
.glance-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 0.75rem;
  margin-bottom: 1.5rem;
}
.glance-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 1rem;
  text-align: center;
}
.glance-card .num { font-size: 1.75rem; font-weight: 700; line-height: 1.1; }
.glance-card .name { font-size: 0.75rem; color: var(--muted); margin-top: 0.35rem; }
.glance-card .chg { font-size: 0.78rem; font-weight: 600; margin-top: 0.35rem; }
.easy-intro { margin-bottom: 1.5rem; }
.stat-period {
  font-size: 0.85rem;
  color: var(--muted);
  margin-bottom: 0.65rem;
}
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
  gap: 0.6rem;
  margin-bottom: 0.75rem;
}
.platform-row {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0.75rem 0.9rem;
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 0.35rem 0.75rem;
  align-items: center;
}
.platform-name { font-weight: 700; font-size: 0.88rem; }
.platform-mid { font-size: 0.82rem; color: var(--muted); text-align: right; }
.platform-pct { font-weight: 700; font-size: 0.95rem; text-align: right; white-space: nowrap; }
.platform-row.up .platform-pct { color: var(--good); }
.platform-row.down .platform-pct { color: var(--bad); }
.platform-row.flat .platform-pct { color: var(--muted); }
.platform-stack { display: flex; flex-direction: column; gap: 0.45rem; margin-bottom: 0.75rem; }
.stat-card {
  background: #111;
  color: #fff;
  border-radius: 12px;
  padding: 1rem 0.85rem;
  text-align: center;
}
.stat-card.hero {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem 1.25rem;
  text-align: left;
  padding: 1.2rem 1.35rem;
}
.stat-card.hero .stat-pct { font-size: 3rem; }
.stat-card.hero .stat-val { font-size: 1.65rem; }
.stat-card.hero .stat-lbl { font-size: 0.78rem; }
.stat-pct {
  font-size: 2rem;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.02em;
}
.stat-card.up .stat-pct { color: #4ade80; }
.stat-card.down .stat-pct { color: #f87171; }
.stat-card.flat .stat-pct { color: #d1d5db; }
.stat-val {
  font-size: 1.1rem;
  font-weight: 700;
  margin-top: 0.35rem;
  line-height: 1.15;
}
.stat-lbl {
  font-size: 0.68rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: rgba(255,255,255,0.55);
  margin-top: 0.25rem;
}
.stat-leak {
  font-size: 0.88rem;
  color: var(--muted);
  line-height: 1.45;
  padding: 0.65rem 0.15rem 0;
}
.stat-leak strong { color: var(--text); font-weight: 600; }
.exception-list {
  list-style: none;
  margin: 0 0 0.85rem;
  padding: 0.85rem 1rem;
  background: #eceef1;
  border-radius: 10px;
  font-size: 0.88rem;
  line-height: 1.5;
  color: var(--text);
}
.exception-list li { padding: 0.15rem 0; }
.exception-list li::before { content: "· "; color: var(--muted); font-weight: 700; }
.highlights-head {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--text);
  margin: 0.75rem 0 0.2rem;
}
.highlights-hint {
  font-size: 0.8rem;
  color: var(--muted);
  margin-bottom: 0.4rem;
}
.mini-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0.75rem 0.65rem;
  text-align: center;
}
.mini-card .mini-roas { font-size: 1.2rem; font-weight: 700; line-height: 1.1; }
.mini-card .mini-name { font-size: 0.78rem; font-weight: 600; margin-top: 0.3rem; line-height: 1.25; }
.mini-card .mini-sub { font-size: 0.72rem; color: var(--muted); margin-top: 0.2rem; }
.info-card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
  gap: 0.55rem;
  margin-bottom: 1rem;
}
.info-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0.75rem 0.7rem;
  text-align: left;
  line-height: 1.35;
}
.info-card-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.35rem;
  margin-bottom: 0.35rem;
}
.info-card-ch {
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
}
.info-card-metric {
  font-size: 1.15rem;
  font-weight: 700;
  line-height: 1.1;
  margin-bottom: 0.25rem;
}
.info-card-title {
  font-size: 0.8rem;
  font-weight: 600;
  line-height: 1.3;
  margin-bottom: 0.2rem;
}
.info-card-sub {
  font-size: 0.72rem;
  color: var(--muted);
}
.info-card-note {
  font-size: 0.68rem;
  color: var(--muted);
  margin-top: 0.35rem;
  padding-top: 0.35rem;
  border-top: 1px solid var(--line);
}
.info-card.test { border-style: dashed; }
.info-card.paused { background: #fafafa; }
.info-section-label {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  margin: 0.85rem 0 0.45rem;
}
.detail-stack { margin-top: 1rem; }
.detail-panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  margin-bottom: 0.5rem;
}
.detail-panel summary {
  padding: 0.85rem 1rem;
  font-weight: 700;
  font-size: 0.92rem;
  cursor: pointer;
  list-style: none;
}
.detail-panel summary::-webkit-details-marker { display: none; }
.detail-panel-body { padding: 0.65rem 1rem 1rem; border-top: 1px solid var(--line); }

.detail-panel-body .panel-hide-title > h2.old-style { display: none; }
.detail-panel-body section { margin-top: 0; }
.easy-read-label {
  font-size: 0.68rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--muted);
  margin: 0.85rem 0 0.45rem;
}
.easy-read-foot {
  font-size: 0.82rem;
  color: var(--muted);
  text-align: center;
  padding: 0.75rem 0 0.25rem;
  border-top: 1px solid var(--line);
  margin-top: 0.5rem;
}
.stat-card.ad-card .stat-pct { font-size: 1.35rem; }
.stat-card.ad-card .stat-val { font-size: 0.82rem; font-weight: 600; }
.week-leak {
  font-size: 0.88rem;
  color: var(--muted);
  margin-top: 0.75rem;
  padding-top: 0.75rem;
  border-top: 1px solid var(--line);
  line-height: 1.45;
}
.glance-stack { display: flex; flex-direction: column; gap: 0.45rem; margin-bottom: 1.25rem; }
.glance-row {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0.85rem 1rem;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 0.15rem 0.75rem;
  align-items: center;
}
.glance-title { font-weight: 700; font-size: 0.92rem; line-height: 1.25; color: var(--text); }
.glance-val { font-weight: 700; font-size: 0.95rem; text-align: right; white-space: nowrap; color: var(--text); }
.glance-sub {
  grid-column: 1 / -1;
  font-size: 0.78rem;
  color: var(--muted);
  line-height: 1.35;
}
section h2 {
  font-size: 0.95rem;
  font-weight: 700;
  margin-bottom: 0.55rem;
}
.health-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem;
  margin-bottom: 1.25rem;
}
.health-pill {
  font-size: 0.72rem;
  font-weight: 600;
  padding: 0.35rem 0.65rem;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--card);
}
.health-pill.good { background: var(--good-bg); color: var(--good); border-color: #bbf7d0; }
.health-pill.watch { background: var(--warn-bg); color: var(--warn); border-color: #fcd34d; }

.compact-table { font-size: 0.82rem; }
.compact-table td, .compact-table th { padding: 0.45rem 0.6rem; }
.flag-item {
  background: var(--card);
  border: 1px solid var(--line);
  border-left: 3px solid var(--warn);
  border-radius: 8px;
  padding: 0.65rem 0.85rem;
  margin-bottom: 0.5rem;

<body>
<header>
  <div>
    <h1>Paid Ads Weekly Read</h1>
    <p class="sub" id="subtitle">Loading…</p>
  </div>
  <div id="quality-badge" class="badge">Checking data…</div>
</header>
<p id="quality-note" class="quality-note" hidden></p>
<div id="error" class="error" style="display:none"></div>
<div id="window-banner" class="window-banner" style="display:none"></div>
<div id="timestamp-bar" class="timestamp-bar" style="display:none">
  <span>Data as of <strong id="data-as-of">—</strong> · Period <strong id="data-period">—</strong></span>
  <span style="display:flex;align-items:center;gap:0.65rem">
    <span id="refresh-status" class="timestamp-live">—</span>
    <button type="button" id="refresh-btn" class="refresh-btn" onclick="refreshData()">Reload data</button>
  </span>
</div>
<div id="filter-bar" class="filter-bar" style="display:none">
  <div class="filter-group">
    <span class="filter-label">Dates</span>
    <select id="filter-period" aria-label="Report period">
      <option value="7">Last 7 days</option>
      <option value="14">Last 14 days</option>
      <option value="30">Last 30 days</option>
      <option value="custom">Pick dates…</option>
    </select>
  </div>
  <div class="filter-group">
    <span class="filter-label">Layout</span>
    <select id="filter-view" aria-label="Layout">
      <option value="all" selected>All details</option>
      <option value="simple">Easy read</option>
      <option value="performance">Numbers only</option>
      <option value="actions">Actions only</option>
      <option value="deep">Campaigns only</option>
    </select>
  </div>
  <div id="custom-range" class="filter-group custom-range">
    <input type="date" id="custom-start" aria-label="Start date">
    <span class="sub">to</span>
    <input type="date" id="custom-end" aria-label="End date">
    <button type="button" class="export-btn" id="apply-custom">Apply</button>
  </div>
  <details class="filter-advanced">
    <summary>More options</summary>
    <div class="adv-inner">
      <div class="filter-group">
        <span class="filter-label">Channel</span>
        <select id="filter-channel" aria-label="Channel filter">
          <option value="all">All</option>
          <option value="meta">Meta</option>
          <option value="google">Google</option>
          <option value="pinterest">Pinterest</option>
        </select>
      </div>
      <div class="filter-group"><label><input type="checkbox" id="filter-compare" checked> vs last period</label></div>
      <div class="filter-group"><label><input type="checkbox" id="filter-month"> vs ~4 weeks ago</label></div>
      <div class="filter-group"><label><input type="checkbox" id="filter-net"> Net after returns</label></div>
      <div class="filter-group"><label><input type="checkbox" id="filter-target"> Show targets</label></div>
      <div class="filter-group"><button type="button" class="export-btn" id="export-csv">Export CSV</button></div>
    </div>
  </details>
</div>
<div id="app"></div>
<footer>
  Shopify orders = truth for ROAS · Numbers refresh when data is pulled · use <strong>All details</strong> for the full analyst view.
</footer>
<script>
const DATA_URL = 'data/latest.json';
const CONFIG_URL = 'config.json';
let reportConfig = { report_window_days: 7, window_ends: 'today' };

function detroitYMD(d = new Date()) {
  return d.toLocaleDateString('en-CA', { timeZone: 'America/Detroit' });
}

function addDays(isoDate, n) {
  const d = new Date(isoDate + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}

function formatWindowLabel(start, end) {
  const s = new Date(start + 'T12:00:00');
  const e = new Date(end + 'T12:00:00');
  const sm = s.toLocaleString('en-US', { month: 'short', timeZone: 'America/Detroit' });
  const em = e.toLocaleString('en-US', { month: 'short', timeZone: 'America/Detroit' });
  const sy = s.getFullYear();
  const ey = e.getFullYear();
  if (sy === ey && sm === em) return `${sm} ${s.getDate()}–${e.getDate()}, ${ey}`;
  if (sy === ey) return `${sm} ${s.getDate()} – ${em} ${e.getDate()}, ${ey}`;
  return `${sm} ${s.getDate()}, ${sy} – ${em} ${e.getDate()}, ${ey}`;
}

function computeRollingWindow(cfg) {
  const days = filters.periodMode === 'custom' && filters.customStart && filters.customEnd
    ? daysBetween(filters.customStart, filters.customEnd)
    : (filters.periodDays || cfg.report_window_days || 7);
  const through = cfg.window_ends || 'today';
  let end = detroitYMD();
  if (through === 'yesterday') end = addDays(end, -1);
  if (filters.periodMode === 'custom' && filters.customEnd) end = filters.customEnd;
  const start = filters.periodMode === 'custom' && filters.customStart
    ? filters.customStart
    : addDays(end, -(days - 1));
  const priorEnd = addDays(start, -1);
  const priorStart = addDays(priorEnd, -(days - 1));
  const monthEnd = addDays(start, -28);
  const monthStart = addDays(monthEnd, -(days - 1));
  return {
    start,
    end,
    days,
    through,
    label: formatWindowLabel(start, end),
    prior_start: priorStart,
    prior_end: priorEnd,
    prior_label: formatWindowLabel(priorStart, priorEnd),
    month_start: monthStart,
    month_end: monthEnd,
    month_label: formatWindowLabel(monthStart, monthEnd),
    mode: filters.periodMode === 'custom' ? 'custom' : 'rolling'
  };
}

function daysBetween(start, end) {
  const a = new Date(start + 'T12:00:00');
  const b = new Date(end + 'T12:00:00');
  return Math.max(1, Math.round((b - a) / 86400000) + 1);
}

function sumDaily(map, start, end) {
  let total = 0;
  let d = start;
  while (d <= end) {
    total += Number(map[d] || 0);
    d = addDays(d, 1);
  }
  return total;
}

function expectedWindow() {
  return computeRollingWindow(reportConfig);
}

function refreshData() {
  const btn = document.getElementById('refresh-btn');
  const status = document.getElementById('refresh-status');
  btn.disabled = true;
  btn.textContent = 'Refreshing…';
  status.textContent = 'Pulling latest data…';
  status.className = 'timestamp-live';
  fetch(DATA_URL + '?t=' + Date.now())
    .then(r => { if (!r.ok) throw new Error('Could not load data'); return r.json(); })
    .then(d => {
      render(d);
      status.textContent = 'Updated just now';
      status.className = 'timestamp-live fresh';
    })
    .catch(() => {
      status.textContent = 'Refresh failed — use server or re-run build';
      status.className = 'timestamp-live stale';
    })
    .finally(() => {
      btn.disabled = false;
      btn.textContent = 'Reload data';
    });
}

function fmt(n) {
  if (n == null || isNaN(n)) return '—';
  if (n >= 1000) return '$' + Math.round(n).toLocaleString();
  return '$' + Number(n).toFixed(0);
}
function roas(n) {
  if (n == null || isNaN(n)) return '—';
  return Number(n).toFixed(2) + '×';
}

function qualitySummary(dq) {
  const entries = Object.entries(dq || {});
  const errors = entries.filter(([, v]) => v.status === 'error');
  const partials = entries.filter(([, v]) => v.status === 'partial');
  if (errors.length) {
    const names = errors.map(([k]) => k.replace(/^blend_/, '').replace(/_/g, ' ')).join(', ');
    return {
      cls: 'partial',
      text: 'Data gaps — ' + names,
      title: errors.map(([k, v]) => k + ': ' + (v.note || v.status)).join('\n')
    };
  }
  if (partials.length) {
    const detail = partials.map(([k, v]) => {
      const name = k.replace(/^blend_/, '').replace(/_/g, ' ');
      const label = name.charAt(0).toUpperCase() + name.slice(1);
      return label + ': ' + (v.note || 'incomplete');
    }).join(' · ');
    return {
      cls: 'partial',
      text: 'Partial data',
      note: detail + ' Shopify store totals are complete.',
      title: detail
    };
  }
  return { cls: 'ok', text: 'All sources ok', note: '', title: 'Shopify, Meta, Google, and GA4 feeds look complete.' };
}

function renderActions(actions) {
  const blocks = [
    ['spend_more', 'Spend more', 'spend'],
    ['pull_back', 'Pull back', 'pull'],
    ['create', 'Create', 'create'],
    ['watch', 'Watch', 'watch'],
  ];
  return blocks.map(([key, title, cls]) => {
    const items = (actions[key] || []).map(a => {
      const text = a.reason || a.item || '';
      const meta = /^zaki$/i.test(a.owner || '')
        ? `Directs: ${reportConfig.director || 'Andrew'} · For ${reportConfig.agency_owner || 'Zaki'}${a.due ? ' · ' + a.due : ''}`
        : [a.owner, a.due].filter(Boolean).join(' · ');
      return `<li><span class="tag">${a.channel || ''}</span> ${text}${meta ? ` <span class="sub">(${meta})</span>` : ''}</li>`;
    }).join('') || '<li>None this week</li>';
    return `<div class="action-card ${cls}"><h3>${title}</h3><ul>${items}</ul></div>`;
  }).join('');
}

function renderDaily(daily) {
  const entries = Object.entries(daily || {});
  if (!entries.length) return '<p class="sub">No daily data</p>';
  const max = Math.max(...entries.map(([,v]) => v));
  return entries.map(([d, v]) => {
    const pct = max ? (v / max * 100) : 0;
    return `<div class="bar-row">
      <span class="bar-label">${d.slice(5)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <span class="bar-val">${v}</span>
    </div>`;
  }).join('');
}

function renderQuality(dq) {
  return Object.entries(dq || {}).map(([k, v]) =>
    `<span class="q-item ${v.status}">${k}: ${v.status}${v.note ? ' — ' + v.note : ''}</span>`
  ).join('');
}

function pctChange(cur, prev) {
  if (prev == null || prev === 0) return { text: '—', cls: 'pct-flat' };
  const p = ((cur - prev) / prev * 100);
  const cls = p > 2 ? 'pct-up' : p < -2 ? 'pct-down' : 'pct-flat';
  const sign = p > 0 ? '+' : '';
  return { text: sign + p.toFixed(0) + '%', cls };
}

function renderExec(summary) {
  const items = (summary || []).map(s => `<li>${s}</li>`).join('');
  return `<ul>${items}</ul>`;
}

function renderKpiTarget(rows) {
  return (rows || []).map(r => {
    const cur = r.unit === '$' ? fmt(r.this_period) : r.this_period + (r.unit === '×' ? '×' : '');
    const prev = r.unit === '$' ? fmt(r.last_period) : r.last_period + (r.unit === '×' ? '×' : '');
    const tgt = r.unit === '$' ? fmt(r.target) : r.target + (r.unit === '×' ? '×' : '');
    const ch = pctChange(r.this_period, r.last_period);
    return `<tr>
      <td>${r.kpi}</td><td><strong>${cur}</strong></td><td class="col-prior">${prev}</td><td class="col-target">${tgt}</td>
      <td class="col-prior ${ch.cls}">${ch.text}</td><td class="status ${r.status}">${r.status}</td>
    </tr>`;
  }).join('');
}

function formatEdt(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('en-US', {
    timeZone: 'America/Detroit',
    weekday: 'short',
    month: 'short',
    day: 'numeric',
    year: 'numeric',
    hour: 'numeric',
    minute: '2-digit',
    timeZoneName: 'short'
  });
}

function ageHours(iso) {
  if (!iso) return 999;
  return (Date.now() - new Date(iso).getTime()) / 3600000;
}

function setTimestamp(data, raw) {
  const bar = document.getElementById('timestamp-bar');
  const asOf = document.getElementById('data-as-of');
  const period = document.getElementById('data-period');
  const status = document.getElementById('refresh-status');
  const banner = document.getElementById('window-banner');
  const expected = computeRollingWindow(reportConfig);
  bar.style.display = 'flex';
  asOf.textContent = formatEdt(raw?.generated_at || data.generated_at);
  period.textContent = (data.window?.label || expected.label) + ' (' + (data.window?.days || expected.days) + 'd' + (filters.periodMode === 'custom' ? ' custom' : '') + ')';
  document.getElementById('subtitle').textContent =
    (data.window?.label || expected.label) + ' vs ' + (data.window?.prior_label || expected.prior_label);

  const dataEnd = data.window?.end;
  const dataStart = data.window?.start;
  const inSync = filters.periodMode !== 'custom' && dataStart === expected.start && dataEnd === expected.end;
  if (filters.periodMode === 'custom') {
    banner.style.display = data.window?.custom_partial ? 'block' : 'none';
    if (data.window?.custom_partial) {
      banner.innerHTML = '<strong>Custom range.</strong> Store orders/revenue summed from daily data. Channel ROAS uses saved snapshot — run refresh for full custom pull.';
    }
  } else if (!inSync && data.window?.label) {
    banner.style.display = 'block';
    banner.innerHTML =
      '<strong>Data refresh pending.</strong> Numbers below are for ' + (data.window.label || (dataStart + ' – ' + dataEnd)) +
      '. Current rolling window is <strong>' + expected.label + '</strong> — scheduled pull will catch up.';
  } else {
    banner.style.display = 'none';
  }

  const hrs = ageHours(data.generated_at);
  if (inSync && hrs < 8) {
    status.textContent = 'Fresh · window rolls daily · auto-refresh 30 min';
    status.className = 'timestamp-live fresh';
  } else if (inSync && hrs < 24) {
    status.textContent = Math.round(hrs) + 'h old · rolling window ' + expected.label;
    status.className = 'timestamp-live';
  } else if (!inSync) {
    status.textContent = 'Window moved — run data refresh for ' + expected.label;
    status.className = 'timestamp-live stale';
  } else {
    status.textContent = Math.round(hrs) + 'h old · stale — run refresh';
    status.className = 'timestamp-live stale';
  }
}

function todoHeadline(action) {
  const t = String(action || '');
  const parts = t.split(/\s*[—–]\s+/);
  const head = parts[0] || t;
  return head.length > 72 ? head.slice(0, 72) + '…' : head;
}

function todoDetail(action) {
  const t = String(action || '');
  const parts = t.split(/\s*[—–]\s+/);
  return parts.length > 1 ? parts.slice(1).join(' — ') : '';
}

function todoTag(t) {
  if (t.status === 'watch') return 'watch';
  const a = (t.action || '').toLowerCase();
  if (/hold|keep|paused|no raise|stay off|don't|do not/.test(a)) return 'hold';
  return 'do';
}

function todoTagLabel(tag) {
  return tag === 'watch' ? 'Watch' : tag === 'hold' ? 'Hold' : 'Do';
}

function todoAssigneeMeta(t) {
  const owner = (t.owner || '').trim();
  const due = t.due && t.due !== 'Ongoing' ? t.due : '';
  const director = reportConfig.director || 'Andrew';
  const agency = reportConfig.agency_owner || 'Zaki';
  if (/^zaki$/i.test(owner)) {
    return ['Directs: ' + director, 'For ' + agency, due].filter(Boolean).join(' · ');
  }
  return [owner || director, due].filter(Boolean).join(' · ');
}

function renderTodoItem(t, i) {
  const tag = todoTag(t);
  const detail = todoDetail(t.action);
  const meta = todoAssigneeMeta(t);
  return `<div class="todo-simple-item">
    <span class="todo-num">${i + 1}</span>
    <div class="todo-simple-body">
      <div class="todo-simple-action"><span class="todo-tag ${tag}">${todoTagLabel(tag)}</span>${todoHeadline(t.action)}</div>

}

const filters = {
  channel: 'all',
  view: 'all',
  showCompare: true,
  showTarget: false,
  showMonthCompare: false,
  useNetRevenue: false,
  periodDays: 7,
  periodMode: 'preset',
  customStart: '',
  customEnd: ''
};
let dashboardData = null;

function storeRev(k) {
  if (!k) return 0;
  return filters.useNetRevenue ? (k.paid_revenue_net ?? k.paid_revenue) : k.paid_revenue;
}

function channelRev(c) {
  if (!c) return 0;
  return filters.useNetRevenue ? (c.shopify_revenue_net ?? c.shopify_revenue) : c.shopify_revenue;
}

function channelRevPrior(c, field) {
  const gross = c[field] ?? 0;
  if (!filters.useNetRevenue) return gross;
  const netField = field.replace('shopify_revenue', 'shopify_revenue_net');
  return c[netField] ?? gross;
}

function channelRoas(c, revField) {
  const r = filters.useNetRevenue
    ? (c.shopify_roas_net ?? c.shopify_roas)
    : c.shopify_roas;
  if (revField === 'last') return filters.useNetRevenue ? roas(channelRevPrior(c, 'shopify_revenue_last'), c.spend_last) : c.shopify_roas_last;
  if (revField === 'month') return c.shopify_roas_month ?? roas(channelRevPrior(c, 'shopify_revenue_month'), c.spend);
  return r;
}

function activeData(raw) {
  if (!raw) return raw;
  if (filters.periodMode === 'preset' && raw.windows?.[String(filters.periodDays)]) {
    const snap = raw.windows[String(filters.periodDays)];
    return { ...raw, ...snap, _source: raw };
  }
  if (filters.periodMode === 'custom' && filters.customStart && filters.customEnd) {
    return sliceCustomRange(raw, filters.customStart, filters.customEnd);
  }
  return raw;
}

function sliceCustomRange(raw, start, end) {
  const orders = sumDaily(raw.daily_orders || {}, start, end);
  const gross = sumDaily(raw.daily_revenue || {}, start, end);
  const net = sumDaily(raw.daily_revenue_net || {}, start, end);
  const days = daysBetween(start, end);
  return {
    ...raw,
    window: {
      start,
      end,
      days,
      label: formatWindowLabel(start, end),
      mode: 'custom',
      custom_partial: true
    },
    kpis: {
      ...(raw.kpis || {}),
      paid_orders: orders,
      paid_revenue: gross,
      paid_revenue_net: net,
      returns_adjusted: gross - net,
      custom_partial: true
    },
    channels: raw.channels || [],
    prior_period: raw.prior_period,
    prior_month: raw.prior_month
  };
}

function monthKpis(data) {
  return data.prior_month?.kpis || {};
}

function channelSlug(name) {
  const n = (name || '').toLowerCase();
  if (n.includes('meta')) return 'meta';
  if (n.includes('google')) return 'google';
  if (n.includes('pinterest')) return 'pinterest';
  return 'other';
}

function priorKpis(data) {
  if (data.prior_period?.kpis) return data.prior_period.kpis;
  const rows = data.kpi_vs_target || [];
  const get = (n) => rows.find(r => r.kpi === n);
  const spendLast = (data.channels || []).reduce((s, c) => s + (c.spend_last || 0), 0);
  return {
    paid_orders: get('Paid orders')?.last_period ?? '—',
    paid_revenue: get('Shopify revenue')?.last_period ?? 0,
    paid_revenue_net: get('Shopify revenue')?.last_period ?? 0,
    total_ad_spend: spendLast || null,
    blended_mer: get('Blended MER')?.last_period ?? null,
    blended_mer_net: get('Blended MER')?.last_period ?? null,
    aov: null,
    cpa_blended: null,
  };
}

function trendPlain(cur, prev) {
  const ch = pctChange(cur, prev);
  if (ch.text === '—') return '—';
  if (ch.cls === 'pct-up') return 'Up ' + ch.text + ' vs last period';
  if (ch.cls === 'pct-down') return 'Down ' + ch.text.replace('-', '') + ' vs last period';
  return 'About flat vs last period';
}

function afterAdSpend(kpis) {
  const sales = Number(kpis?.paid_revenue) || 0;
  const spend = Number(kpis?.total_ad_spend) || 0;
  return sales - spend;
}

function adAttributedSales(data) {
  return (data.channels || []).reduce((s, c) => s + Number(channelRev(c) || 0), 0);
}

function adAttributedSalesPrior(data) {
  return (data.channels || []).reduce((s, c) => s + Number(channelRevPrior(c, 'shopify_revenue_last') || 0), 0);
}

function adAttributedOrders(data) {
  return (data.channels || []).reduce((s, c) => s + Number(c.shopify_orders || 0), 0);
}

function trendArrow(cur, prev) {
  const ch = pctChange(cur, prev);
  if (ch.text === '—') return { arrow: '→', pct: '—', cls: 'flat', word: 'flat', ch };
  const pct = ch.text.replace('+', '').replace('-', '');
  if (ch.cls === 'pct-up') return { arrow: '↑', pct, cls: 'up', word: 'up', ch };
  if (ch.cls === 'pct-down') return { arrow: '↓', pct, cls: 'down', word: 'down', ch };
  return { arrow: '→', pct: ch.text, cls: 'flat', word: 'about flat', ch };
}

function channelLabel(name) {
  return (name || '').replace('Google PMax', 'Google');
}

function leakSummary(data) {
  const parts = [];
  (data.channels || []).forEach(c => {
    const label = channelLabel(c.name);
    const plat = Number(c.platform_purchases) || 0;
    const shop = Number(c.shopify_orders) || 0;
    if (plat > shop + 2) parts.push(`${label} ${plat} platform vs ${shop} Shopify`);
    else if (Number(c.spend) >= 100 && shop === 0) parts.push(`${label} ${fmt(c.spend)} · 0 orders`);
  });
  return parts.slice(0, 2).join(' · ');
}

function statCard(label, cur, prev, fmtFn, opts = {}) {

  const ch = opts.channel ? ` data-channel="${opts.channel}"` : '';
  if (opts.hero) {
    return `<div class="stat-card ${arr.cls}${hero}"${ch}>
      <div class="stat-pct">${arr.pct === '—' ? '→' : arr.arrow + ' ' + arr.pct}</div>
      <div>
        <div class="stat-val">${val}</div>
        <div class="stat-lbl">${label}</div>
      </div>
    </div>`;
  }
  return `<div class="stat-card ${arr.cls}${hero}"${ch}>
    <div class="stat-pct">${arr.pct === '—' ? '→' : arr.arrow + ' ' + arr.pct}</div>
    <div class="stat-val">${val}</div>
    <div class="stat-lbl">${label}</div>
  </div>`;
}

function platformStatCard(c) {

function exceptionLines(data) {
  const lines = [];
  const slow = storeSlowdown(data);
  if (slow && filters.showCompare) {
    lines.push('Store slower vs last week (' + slow.revPct.toFixed(0) + '% revenue)');

  const leak = leakSummary(data);
  if (leak) lines.push('Leakage: ' + leak);
  const pull = (data.actions?.pull_back || []).find(a => a.channel && a.channel !== '—');
  if (pull) lines.push('Pull back ' + pull.channel + ' — ' + shortText(pull.reason, 55));
  else {
    const scale = (data.actions?.spend_more || []).find(a => a.channel && a.channel !== '—');
    if (scale) lines.push('Scale ' + scale.channel + ' — ' + shortText(scale.reason, 55));
  }
  const todo = (data.strategy_todos || [])[0];
  if (todo && lines.length < 3) lines.push('Next: ' + todoHeadline(todo.action));
  return lines.slice(0, 3);
}

function storeSlowdown(data) {
  const k = data.kpis || {};
  const p = priorKpis(data);
  const w = data.window || {};
  const threshold = Number(data.thresholds?.anomaly_pct_threshold) || 15;
  const rev = storeRev(k);
  const revP = filters.useNetRevenue ? (p.paid_revenue_net ?? p.paid_revenue) : p.paid_revenue;
  if (!revP || !p.paid_orders) return null;
  const revPct = (rev - revP) / revP * 100;
  const ordPct = (k.paid_orders - p.paid_orders) / p.paid_orders * 100;
  const revDown = revPct <= -threshold;
  const ordDown = ordPct <= -threshold;
  if (!revDown && !ordDown) return null;
  const priorLabel = w.prior_label || 'last period';
  const bits = [];
  if (revDown) bits.push(`${fmt(rev)} revenue (${revPct.toFixed(0)}%)`);
  if (ordDown) bits.push(`${k.paid_orders} orders (${ordPct.toFixed(0)}%)`);
  return {
    cls: revDown && ordDown ? 'bad' : 'watch',
    title: 'Store slowdown · whole store vs ' + priorLabel,
    action: `${bits.join(' · ')} vs ${priorLabel} (${fmt(revP)} · ${p.paid_orders} orders). Slower week — review channel mix; partial days in the window can pull totals down.`,
    revPct,
    ordPct,
  };
}

function overallHealth(data) {

function renderDailySpark(data) {
  const daily = data.daily_orders || {};
  const entries = Object.entries(daily).sort();
  if (entries.length < 2) return '';
  const max = Math.max(...entries.map(([, v]) => v), 1);
  const bars = entries.map(([d, v]) => {
    const pct = Math.round(v / max * 100);
    const day = d.slice(5).replace('-', '/');
    return `<div class="bar-row"><span class="bar-label">${day}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span class="bar-val">${v}</span></div>`;
  }).join('');
  const peak = entries.reduce((a, b) => b[1] > a[1] ? b : a);
  const low = entries.reduce((a, b) => b[1] < a[1] ? b : a);
  return `
    <section data-view="detailed performance">
      <h2>Daily orders</h2>
      <p class="section-hint">Best: ${peak[0]} (${peak[1]}) · Slowest: ${low[0]} (${low[1]})</p>
      <div class="bar-chart">${bars}</div>
    </section>`;
}

function wowMetric(label, cur, prev, fmtFn, monthVal) {
  const ch = pctChange(cur, prev);

  const fmtCur = fmtFn ? fmtFn(cur) : cur;
  const fmtPrev = fmtFn ? fmtFn(prev) : prev;
  const fmtMonth = monthVal != null && fmtFn ? fmtFn(monthVal) : monthVal;
  return `<div class="wow-card">
    <div class="metric">${label}</div>
    <div class="this-val">${fmtCur ?? '—'}</div>
    <div class="wow-last col-prior">Last: ${fmtPrev ?? '—'}</div>
    <div class="delta col-prior ${ch.cls}">${ch.text !== '—' ? ch.text + ' vs last' : '—'}</div>
    ${monthVal != null ? `<div class="wow-last col-month">~4 wks ago: ${fmtMonth ?? '—'}</div><div class="delta col-month ${mch.cls}">${mch.text !== '—' ? mch.text + ' vs month' : '—'}</div>` : ''}

}

function renderHistoryTrend(data) {
  const hist = (data.history_weekly || []).slice(-8);
  if (hist.length < 2) return '';
  const maxOrd = Math.max(...hist.map(h => h.orders || 0), 1);
  const maxRev = Math.max(...hist.map(h => h.revenue || 0), 1);
  const maxMer = Math.max(...hist.map(h => h.mer || 0), 0.1);
  const ordBars = hist.map(h => {
    const pct = Math.round((h.orders || 0) / maxOrd * 100);
    return `<div class="bar-row"><span class="bar-label">${h.label.replace(', 2026', '')}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span class="bar-val">${h.orders}</span></div>`;
  }).join('');
  const revBars = hist.map(h => {
    const pct = Math.round((h.revenue || 0) / maxRev * 100);
    return `<div class="bar-row"><span class="bar-label">${h.label.replace(', 2026', '')}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span class="bar-val">${Math.round((h.revenue || 0) / 1000)}k</span></div>`;
  }).join('');
  const merBars = hist.map(h => {
    const pct = Math.round((h.mer || 0) / maxMer * 100);
    return `<div class="bar-row"><span class="bar-label">${h.label.replace(', 2026', '')}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span class="bar-val">${(h.mer || 0).toFixed(1)}</span></div>`;
  }).join('');
  return `
    <section data-view="detailed performance">
      <h2 class="old-style">Historical trend</h2>
      ${sectionHint('Rolling snapshots build over time — each refresh appends the current window. Use for direction, not exact audit.')}
      <div class="trend-grid">
        <div class="trend-panel"><h3>Store orders</h3>${ordBars}</div>
        <div class="trend-panel"><h3>Store revenue</h3>${revBars}</div>
        <div class="trend-panel"><h3>Blended MER</h3>${merBars}</div>
      </div>
    </section>`;
}

function applyFilters() {
  const ch = filters.channel;
  const view = filters.view;
  document.querySelectorAll('[data-view]').forEach(el => {
    const views = (el.dataset.view || '').split(/\s+/);
    let viewOk;
    if (view === 'all') viewOk = true;
    else if (view === 'simple') viewOk = views.includes('simple');
    else viewOk = views.includes(view);
    const chAttr = el.dataset.channel;
    const chOk = !chAttr || ch === 'all' || chAttr === ch;
    el.style.display = (viewOk && chOk) ? '' : 'none';
  });
  document.querySelectorAll('tr[data-channel]').forEach(tr => {
    const chOk = ch === 'all' || tr.dataset.channel === ch;
    tr.style.display = chOk ? '' : 'none';
  });
  document.querySelectorAll('.health-pill[data-channel]').forEach(el => {
    const chOk = ch === 'all' || el.dataset.channel === ch;
    el.style.display = chOk ? '' : 'none';
  });
  document.querySelectorAll('.col-prior, .wow-last').forEach(el => {
    el.style.display = filters.showCompare ? '' : 'none';
  });
  document.querySelectorAll('[data-store-slowdown]').forEach(el => {

  });
  document.querySelectorAll('.col-month').forEach(el => {
    el.style.display = filters.showMonthCompare ? '' : 'none';
  });
  document.querySelectorAll('.col-target').forEach(el => {
    el.style.display = filters.showTarget ? '' : 'none';

}

function exportCsv() {
  if (!dashboardData) return;
  const data = activeData(dashboardData);
  const w = data.window || {};
  const lines = [
    ['Paid Social Analyst Brief export'],
    ['Generated', dashboardData.generated_at || ''],
    ['Period', w.label || ''],
    ['Compare last', w.prior_label || ''],
    ['Compare month', w.month_label || data.prior_month?.window?.label || ''],
    ['Net revenue', filters.useNetRevenue ? 'yes' : 'no'],
    [],
    ['Metric', 'This', 'Last period', 'Vs last %'],
  ];
  const k = data.kpis || {};
  const p = priorKpis(data);
  const rows = [
    ['Store orders', k.paid_orders, p.paid_orders],
    ['Store revenue', storeRev(k), filters.useNetRevenue ? (p.paid_revenue_net ?? p.paid_revenue) : p.paid_revenue],
    ['Ad spend', k.total_ad_spend, p.total_ad_spend],
    ['Blended MER', filters.useNetRevenue ? k.blended_mer_net : k.blended_mer, filters.useNetRevenue ? p.blended_mer_net : p.blended_mer],
  ];
  rows.forEach(r => {
    const ch = pctChange(r[1], r[2]);
    lines.push([r[0], r[1], r[2], ch.text]);
  });
  lines.push([]);
  lines.push(['Channel', 'Orders', 'Last orders', 'Revenue', 'Last revenue', 'Spend', 'Last spend', 'ROAS', 'Last ROAS']);
  (data.channels || []).forEach(c => {
    lines.push([
      c.name,
      c.shopify_orders,
      c.shopify_orders_last,
      channelRev(c),
      channelRevPrior(c, 'shopify_revenue_last'),
      c.spend,
      c.spend_last,
      channelRoas(c),
      channelRoas(c, 'last')
    ]);
  });
  const csv = lines.map(row => row.map(cell => `"${String(cell ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `paid-social-brief-${w.start || 'export'}-${w.end || ''}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function initFilters() {
  const bar = document.getElementById('filter-bar');
  bar.style.display = 'flex';
  const saved = sessionStorage.getItem('br-dashboard-filters');
  if (saved) Object.assign(filters, JSON.parse(saved));
  document.getElementById('filter-view').value = filters.view;
  document.getElementById('filter-channel').value = filters.channel;
  document.getElementById('filter-period').value = filters.periodMode === 'custom' ? 'custom' : String(filters.periodDays);
  document.getElementById('filter-compare').checked = filters.showCompare;
  document.getElementById('filter-target').checked = filters.showTarget;
  document.getElementById('filter-month').checked = filters.showMonthCompare;
  document.getElementById('filter-net').checked = filters.useNetRevenue;
  document.getElementById('custom-range').style.display = filters.periodMode === 'custom' ? 'flex' : 'none';
  if (filters.customStart) document.getElementById('custom-start').value = filters.customStart;
  if (filters.customEnd) document.getElementById('custom-end').value = filters.customEnd;

  const persist = () => sessionStorage.setItem('br-dashboard-filters', JSON.stringify(filters));

  ['filter-view', 'filter-channel'].forEach(id => {
    document.getElementById(id).addEventListener('change', e => {
      filters[id === 'filter-view' ? 'view' : 'channel'] = e.target.value;
      persist();
      applyFilters();
    });
  });
  ['filter-compare', 'filter-target', 'filter-month', 'filter-net'].forEach(id => {
    document.getElementById(id).addEventListener('change', e => {
      const map = {
        'filter-compare': 'showCompare',
        'filter-target': 'showTarget',
        'filter-month': 'showMonthCompare',
        'filter-net': 'useNetRevenue'
      };
      filters[map[id]] = e.target.checked;
      persist();
      if (dashboardData) render(dashboardData);
      else applyFilters();
    });
  });
  document.getElementById('filter-period').addEventListener('change', e => {
    if (e.target.value === 'custom') {
      filters.periodMode = 'custom';
      document.getElementById('custom-range').style.display = 'flex';
      if (!filters.customEnd) filters.customEnd = detroitYMD();
      if (!filters.customStart) filters.customStart = addDays(filters.customEnd, -6);
      document.getElementById('custom-start').value = filters.customStart;
      document.getElementById('custom-end').value = filters.customEnd;
    } else {
      filters.periodMode = 'preset';
      filters.periodDays = parseInt(e.target.value, 10);
      document.getElementById('custom-range').style.display = 'none';
    }
    persist();
    if (dashboardData) render(dashboardData);
  });
  document.getElementById('apply-custom').addEventListener('click', () => {
    filters.customStart = document.getElementById('custom-start').value;
    filters.customEnd = document.getElementById('custom-end').value;
    filters.periodMode = 'custom';
    persist();
    if (dashboardData) render(dashboardData);
  });
  document.getElementById('export-csv').addEventListener('click', exportCsv);
}
