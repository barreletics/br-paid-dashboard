<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paid Ads</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--g:#047857;--gb:#d1fae5;--r:#b91c1c;--rb:#fee2e2;--a:#92400e;--ab:#fef3c7;--b:#1d4ed8;--bb:#dbeafe}
[data-theme=dark]{--bg:#0b0f17;--card:#151b26;--tx:#e5e7eb;--mu:#9ca3af;--bd:#273042;--g:#34d399;--gb:#06281d;--r:#f87171;--rb:#3a1414;--a:#fbbf24;--ab:#33260a;--b:#93c5fd;--bb:#10223f}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
a{color:var(--b);text-decoration:none}header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}h1{font-size:16px;margin:0;flex:1}
button,.seg button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 10px;font-size:13px}
.seg{display:flex}.seg button{border-radius:0}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}.seg button.on{background:var(--tx);color:var(--card)}
.asof{font-size:12px;color:var(--mu);margin-top:4px}main{padding:12px;max-width:900px;margin:auto}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}.tile{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.tl{font-size:12px;color:var(--mu)}.tv{font-size:22px;font-weight:700;margin:2px 0}.chip{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;white-space:nowrap}
.tile .tile-chip{display:block;margin:4px 0 6px}.tile .tile-chip .chip{display:inline-block;max-width:100%;white-space:normal;line-height:1.35}.tile .tile-sub{display:block;margin-top:0;line-height:1.35}
.up{background:var(--gb);color:var(--g)}.dn{background:var(--rb);color:var(--r)}.nt{background:var(--bd);color:var(--mu)}.am{background:var(--ab);color:var(--a)}.bl{background:var(--bb);color:var(--b)}
.badge{font-size:10px;text-transform:uppercase;letter-spacing:.03em;padding:1px 5px;border-radius:4px;margin-left:4px}.store{background:var(--gb);color:var(--g)}.plat{background:var(--ab);color:var(--a)}
.todos{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 10px}.todos a{flex:0 1 auto;max-width:100%;font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.todos a.red{border-color:var(--r);color:var(--r)}.todos a.amb{border-color:var(--a);color:var(--a)}
h2{font-size:15px;margin:0 0 8px}.sub{font-size:12px;color:var(--mu);margin:-4px 0 8px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:right;vertical-align:top}th:first-child,td:first-child{text-align:left}th{font-size:11px;color:var(--mu);font-weight:600}
.scroll{overflow-x:auto}.ch{border-top:1px solid var(--bd);padding:10px 0}.ch:first-of-type{border-top:0}.chh{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}.kv div{font-size:12px;color:var(--mu)}.kv b{display:block;font-size:15px;color:var(--tx)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;position:relative;margin:4px 0}.bar i{display:block;height:100%;background:var(--b)}.bar i.over{background:var(--r)}.bar s{position:absolute;top:0;bottom:0;width:2px;background:var(--tx)}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:10px}summary{padding:12px;font-weight:600;cursor:pointer}details>div{padding:0 12px 12px}
.note{font-size:12px;padding:8px;border-radius:8px;background:var(--ab);color:var(--a);margin:6px 0}.na{color:var(--mu);font-style:italic}.pin{background:var(--bb)}
.src{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--bd);padding:6px 0;font-size:13px}.err{color:var(--r);padding:20px}
.dec{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}.dcard{border:1px solid var(--bd);border-radius:10px;padding:10px}
.dcard h3{font-size:14px;margin:0 0 4px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;align-items:center}.dcard table{font-size:12px}.dline{font-size:13px;margin-top:6px}.dline b{font-weight:700}
.legend button.on{background:var(--tx);color:var(--card)}.legend button{border-radius:999px;padding:4px 10px}.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.legend .chip{white-space:normal}.tot td{font-weight:700;border-top:2px solid var(--bd)}
.camp-list{display:flex;flex-direction:column;gap:10px}.camp-row{border:1px solid var(--bd);border-radius:12px;padding:12px 14px;background:var(--bg);display:block;color:inherit;text-decoration:none}
.camp-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.camp-name{font-size:16px;font-weight:650;line-height:1.25;flex:1;min-width:0}
.camp-stats{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:15px;font-weight:600}
.camp-stats span{color:var(--mu);font-weight:500}.camp-stats b{color:var(--tx);font-weight:700}
details.fold{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:10px}details.fold>summary{padding:14px;font-weight:600;cursor:pointer;font-size:15px;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px}
details.fold>summary::-webkit-details-marker{display:none}details.fold>summary::after{content:'＋';color:var(--mu);font-size:18px;font-weight:400}details.fold[open]>summary::after{content:'−'}
details.fold>div{padding:0 14px 14px}
.chip.winlab{background:var(--gb);color:var(--g);font-size:12px;font-weight:700;padding:4px 10px}
.chip.watchlab{background:var(--ab);color:var(--a);font-size:12px;font-weight:700;padding:4px 10px}
.chip.loselab{background:var(--rb);color:var(--r);font-size:12px;font-weight:700;padding:4px 10px}
.chip.pausedlab{background:var(--bd);color:var(--mu);font-size:12px;font-weight:700;padding:4px 10px}
.meaning{background:var(--bb);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:14px;line-height:1.5;font-size:16px}
.meaning strong{display:block;font-size:13px;color:var(--mu);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.meaning p{margin:0 0 8px}.meaning p:last-child{margin:0}
.answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.answer-tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 14px 12px;min-width:0}
.answer-tile h3{font-size:12px;color:var(--mu);margin:0 0 8px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.answer-tile .ans{font-size:19px;font-weight:750;line-height:1.3;color:var(--tx)}
.answer-tile .ans-sub{font-size:14px;color:var(--mu);margin-top:8px;line-height:1.45}
.answer-tile .ans-line{margin-top:6px;font-size:15px;line-height:1.4}
.answer-tile .ans-line b{color:var(--tx)}
.answer-tile.a-win{border-color:var(--g);background:linear-gradient(180deg,var(--gb),var(--card) 55%)}
.answer-tile.a-lose{border-color:var(--r);background:linear-gradient(180deg,var(--rb),var(--card) 55%)}
.answer-range{font-size:13px;color:var(--mu);margin:-6px 0 10px}
@media (max-width:480px){.answer-grid{grid-template-columns:1fr;gap:12px}.answer-tile .ans{font-size:21px}.answer-tile{padding:16px}}
.map-sec{margin-bottom:18px}.map-h{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:10px;font-weight:700}
.map-n{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:999px;background:var(--tx);color:var(--card);font-size:14px;flex-shrink:0}
.lab-row{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px}
.hint{border:0;background:none;color:var(--b);font-size:11px;padding:0 2px;cursor:pointer;text-decoration:underline;font-weight:500}
.empty-state{color:var(--mu);font-size:15px;padding:8px 0}
.sec5-wrap{border:2px solid var(--bd);border-radius:14px;padding:12px;background:var(--card)}
.sec5-wrap>.fold{margin-bottom:8px}
@media (max-width:480px){
.meaning{font-size:17px;padding:16px}.map-h{font-size:18px}
body{font-size:16px;line-height:1.45}h1{font-size:18px}h2{font-size:17px;margin-bottom:10px}
.tiles{gap:10px}.tile{padding:12px}.tl{font-size:13px}.tv{font-size:26px}
main{padding:10px;max-width:100%;overflow-x:hidden}.card{padding:14px}
.camp-name{font-size:17px}.camp-stats{font-size:16px}
button,.seg button{font-size:14px;padding:8px 12px;min-height:40px}
details.fold>summary{font-size:16px;padding:16px 14px}
.scroll{overflow-x:visible;-webkit-overflow-scrolling:auto}table{font-size:14px;display:block;max-width:100%;overflow-x:visible}
.todos{display:none}
}
</style></head><body>
<header><div class="row"><h1>Paid Ads</h1>
<div class="seg" id="win"><button data-w="today">Today</button><button data-w="yesterday">Yesterday</button><button data-w="7d">7d</button><button data-w="30d">30d</button></div>
<button id="reload" title="Reload">⟳</button><button id="theme" title="Dark mode">◐</button></div>
<div class="asof" id="asof">Loading…</div></header>
<main id="app"></main>
<script>
const ACT='10152741884925238',SHOP='barreletics';
const L={meta:`https://adsmanager.facebook.com/adsmanager/manage/campaigns?act=${ACT}`,metaAds:`https://adsmanager.facebook.com/adsmanager/manage/ads?act=${ACT}`,google:'https://ads.google.com/aw/campaigns',pin:'https://ads.pinterest.com/',tiktok:'https://ads.tiktok.com/',shop:`https://admin.shopify.com/store/${SHOP}/orders`,ga:'https://analytics.google.com/analytics/web/',old:'../'};
const order=n=>`https://admin.shopify.com/store/${SHOP}/orders?query=${encodeURIComponent(String(n).replace('#',''))}`;
const chLink=n=>/meta/i.test(n)?L.meta:/google/i.test(n)?L.google:/pinterest/i.test(n)?L.pin:/tiktok/i.test(n)?L.tiktok:L.shop;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>typeof v==='number'&&isFinite(v);
const NA='<span class="na">not available</span>';
const usd=(v,d=0)=>num(v)?'$'+v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}):NA;
const x=v=>num(v)?v.toFixed(2)+'×':NA,n0=v=>num(v)?v.toLocaleString('en-US'):NA;
const B=t=>t==='s'?'<span class="badge store">store</span>':'<span class="badge plat">platform</span>';
const fmtT=s=>{if(!s)return null;const d=new Date(s);return isNaN(d)?s:d.toLocaleString('en-US',{timeZone:'America/Detroit',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' ET'};
const daysAgo=ds=>{if(!ds)return null;return Math.floor((Date.now()-new Date(ds+'T12:00:00-04:00'))/864e5)};
function chip(cur,prev,good='up',label){if(!num(cur)||!num(prev)||prev===0)return '<span class="chip nt">no prior</span>';const p=(cur-prev)/Math.abs(prev)*100;const better=good==='up'?p>=0:p<=0;return `<span class="chip ${Math.abs(p)<1?'nt':better?'up':'dn'}">${p>=0?'▲':'▼'} ${Math.abs(p).toFixed(0)}% ${label}</span>`}
let D=null,W=localStorage.getItem('v2win2')||'7d',F='all';if(!['today','yesterday','7d','30d'].includes(W))W='7d';
const th=localStorage.getItem('v2theme');if(th==='dark')document.documentElement.dataset.theme='dark';
$('#theme').onclick=()=>{const d=document.documentElement;const dark=d.dataset.theme!=='dark';if(dark)d.dataset.theme='dark';else delete d.dataset.theme;localStorage.setItem('v2theme',dark?'dark':'light')};
$('#reload').onclick=()=>load(true);
document.querySelectorAll('#win button').forEach(b=>b.onclick=()=>{W=b.dataset.w;localStorage.setItem('v2win2',W);render()});
async function load(){try{const r=await fetch('../data/latest.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);D=await r.json();render()}catch(e){$('#app').innerHTML=`<div class="err">Could not load data/latest.json: ${esc(e.message)}</div>`}}
const MOB=()=>typeof window!=='undefined'&&window.innerWidth<=480;
function fold(id,title,html,openIf){const open=!!openIf&&!MOB();return `<details class="fold" id="${id}"${open?' open':''}><summary>${esc(title)}</summary><div>${html}</div></details>`}
function sec(id,title,html,open){return fold(id,title,html,open)}
function parseStoreKM(km){const m=String(km||'').match(/(?:store last-touch:\s*)?(\d+)\s+orders?\s*·\s*\$([\d,]+\.?\d*)\s*·\s*([\d.]+)\s*×/i);if(!m)return null;return {orders:+m[1],revenue:parseFloat(m[2].replace(/,/g,'')),roas:+m[3]}}
function campWeekLabel(row,T){const st=parseStoreKM(row.key_metric)||{};const spend=row.spend_period||0;const paused=/paused/i.test(row.status||'');if(paused)return {text:'Paused',cls:'pausedlab',key:'paused'};
 const wT=T.winner_roas??1.6,bT=T.breakeven_roas??0.9,minS=T.min_spend_for_call??50;
 const r=st.roas;if(!num(r))return {text:'Keep watching',cls:'watchlab',key:'watch'};
 if(r>=wT)return {text:'Working well',cls:'winlab',key:'win'};
 if(r<bT&&spend>=minS)return {text:'Needs help',cls:'loselab',key:'lose'};
 return {text:'Keep watching',cls:'watchlab',key:'watch'}}
const CAMP_WANT=[['Meta',/Prospecting|Barreletix/i,'Meta Prospecting'],['Meta',/Creative Test/i,'Meta Creative Test'],['Meta',/Two-Pair/i,'Meta Two-Pair Offer'],['Meta',/Retargeting/i,'Meta Retargeting'],['Google',/PMax/i,'Google PMax'],['Pinterest',/Restore Winner/i,'Pinterest Restore Winner'],['Pinterest',/Reel Test/i,'Pinterest Reel Test']];
function campData(){const T=(D.ad_decisions||{}).thresholds||D.thresholds||{};const ms=D.meta_shopify_attribution_7d||{};const rows=D.campaign_status||[];const out=[];
 CAMP_WANT.forEach(([ch,re,title])=>{const row=rows.find(r=>r.channel===ch&&re.test(r.campaign||''));if(!row)return;
  const st=parseStoreKM(row.key_metric);const meta=(ms.campaigns||[]).find(c=>re.test(c.meta_campaign_name||c.campaign_label||'')&&!/\+\s*Retargeting/i.test(c.campaign_label||''));
  const spend=row.spend_period;let orders=st?st.orders:null,roas=st?st.roas:null,revenue=st?st.revenue:null;
  if(meta&&!st){orders=meta.shopify_orders;roas=meta.shopify_roas;revenue=meta.shopify_revenue}
  const lab=campWeekLabel(row,T);out.push({title,row,spend,orders,roas,revenue,lab,channel:row.channel})});
 return {items:out,win:(ms.window||{})}}
function campRowHTML(c){const roasTxt=num(c.roas)?c.roas.toFixed(1)+'× per $1':(/paused/i.test(c.row.status||'')?'—':'n/a');
 const ordTxt=num(c.orders)?n0(c.orders)+' store order'+(c.orders===1?'':'s'):(/paused/i.test(c.row.status||'')?'0 store orders':'—');
 return `<a class="camp-row" href="${chLink(c.channel)}" target="_blank" rel="noopener"><div class="camp-top"><span class="camp-name">${esc(c.title)}</span><span class="chip ${c.lab.cls}">${esc(c.lab.text)}</span></div><div class="camp-stats"><span>Spent <b>${usd(c.spend,2)}</b></span><span><b>${ordTxt}</b></span><span>Return per $1 <b>${roasTxt}</b></span></div></a>`}
function campListHTML(list){const inner=list.length?list.map(campRowHTML).join(''):('<div class="empty-state">'+NA+'</div>');return '<div class="camp-list">'+inner+'</div>'}
function hint(t){return `<button type="button" class="hint" data-hint="${esc(t)}">what's this?</button>`}
function whatThisMeansHTML(k,tagNow,camps,winLab){
 const sp=k.total_ad_spend;const back=tagNow;const win=winLab||camps.win?.label||'this period';
 const active=camps.items.filter(c=>c.lab.key!=='paused'&&num(c.roas));
 const paused=camps.items.filter(c=>c.lab.key==='paused');
 let best=null,worst=null;
 active.forEach(c=>{if(!best||c.roas>best.roas)best=c;if(!worst||c.roas<worst.roas)worst=c});
 if(paused.length)worst={title:'Pinterest (paused)',lab:{key:'paused'}};
 else if(active.find(c=>c.lab.key==='lose'))worst=active.filter(c=>c.lab.key==='lose').sort((a,b)=>a.roas-b.roas)[0]||worst;
 const bName=best?best.title:'—';const wName=worst?worst.title:'—';
 const wDetail=worst&&worst.lab?.key==='paused'?'paused':(worst&&num(worst.roas)?worst.roas.toFixed(1)+'× return per $1':'needs attention');
 const bestExtra=best&&num(best.roas)?' ('+best.roas.toFixed(1)+'× return per $1 spent)':'';
 return `<div class="meaning" id="what-means"><strong>What this means</strong>
 <p>We spent <b>${usd(sp)}</b> on ads (${esc(win)}) and store sales tied to those ads were <b>${usd(back)}</b>.</p>
 <p>Best performer: <b>${esc(bName)}</b>${bestExtra}.</p>
 <p>Biggest concern: <b>${esc(wName)}</b> (${esc(wDetail)}).</p></div>`}
function answerTilesHTML(camps){
 const w7=(D.windows||{})['7']||{};const k7=w7.kpis||{};const ch7=w7.channels||[];
 const winLab=esc(camps.win.label||w7.window?.label||'Last 7 days');
 const items=camps.items;const active=items.filter(c=>c.lab.key!=='paused'&&num(c.roas));
 const withOrd=items.filter(c=>num(c.orders)&&c.orders>0&&num(c.spend));
 const byRoas=active.slice().sort((a,b)=>b.roas-a.roas);
 const byCpa=withOrd.slice().sort((a,b)=>(a.spend/a.orders)-(b.spend/b.orders));
 const bestRet=byRoas[0];const cheap=byCpa[0];
 const winners=byRoas.filter(c=>c.lab.key==='win'||(c.roas>=((D.ad_decisions||{}).thresholds||{}).winner_roas));const showWin=winners.length?winners:byRoas.slice(0,3);
 const working=showWin.map(c=>esc(c.title)+' · '+c.roas.toFixed(1)+'×').join('<br>')||NA;
 let notTitle='—',notSub='';
 const paused=items.filter(c=>c.lab.key==='paused');
 const losing=active.filter(c=>c.lab.key==='lose').sort((a,b)=>a.roas-b.roas);
 const weak=active.filter(c=>c.lab.key==='watch').sort((a,b)=>a.roas-b.roas);
 if(paused.length){notTitle='Pinterest (paused)';notSub=paused.map(c=>esc(c.title)+' · spent '+usd(c.spend,0)+', 0 store orders').join('<br>')}
 else if(losing.length){notTitle=esc(losing[0].title);notSub=(losing[0].roas.toFixed(1)+'× return per $1 · needs help')}
 else if(weak.length){notTitle=esc(weak[0].title);notSub=(weak[0].roas.toFixed(1)+'× return per $1 · keep watching')}
 const total=num(k7.total_ad_spend)?k7.total_ad_spend:ch7.reduce((a,c)=>a+(c.spend||0),0);
 const chSpend=ch7.map(c=>{const n=/google/i.test(c.name)?'Google':/pinterest/i.test(c.name)?'Pinterest':'Meta';return n+' '+usd(c.spend,0)}).join(' · ');
 const cheapLine=cheap?(esc(cheap.title)+' · <b>'+usd(cheap.spend/cheap.orders,0)+'</b> per store order'):NA;
 const bestLine=bestRet?(esc(bestRet.title)+' · <b>'+bestRet.roas.toFixed(1)+'×</b> return per $1'):NA;
 return `<div class="answer-range">Last 7 days · ${winLab} · Shopify last-touch</div><div class="answer-grid" id="answer-tiles">
 <div class="answer-tile a-win"><h3>1 · What's working</h3><div class="ans">${working}</div><div class="ans-sub">Highest store return per $1 spent</div></div>
 <div class="answer-tile a-lose"><h3>2 · What's not</h3><div class="ans">${notTitle}</div><div class="ans-sub">${notSub||'Nothing flagged as losing'}</div></div>
 <div class="answer-tile"><h3>3 · What it costs</h3><div class="ans">${usd(total,0)} total</div><div class="ans-sub">${chSpend}</div></div>
 <div class="answer-tile a-win"><h3>4 · Cheapest &amp; best</h3><div class="ans-line">Cheapest order:<br>${cheapLine}</div><div class="ans-line" style="margin-top:10px">Best return:<br>${bestLine}</div></div></div>`}
function whatNextHTML(){const bits=[];
 (D.next_week_priorities||[]).slice(0,6).forEach(p=>bits.push(typeof p==='string'?p:(p.action||p.text||'')));
 (D.strategy_todos||[]).filter(t=>t.status==='open').slice(0,4).forEach(t=>bits.push(`${t.owner}: ${t.action}`));

 <div class="tl">Projected month: ${usd(bp.projected_month_spend)}</div>`+
 (bp.by_channel||[]).map(c=>`<div style="margin-top:8px"><div class="chh" style="font-weight:400"><a href="${chLink(c.channel)}" target="_blank">${esc(c.channel)}</a><span>${usd(c.mtd_spend)} / ${usd(c.monthly_plan)} <span class="chip ${c.status==='over'?'dn':c.status==='under'?'am':'up'}">${esc(c.status)}</span></span></div>${pbar(c.mtd_spend,c.monthly_plan)}<div class="tl">source: ${esc(c.spend_source)}</div></div>`).join('');
 const kv=D.kpi_vs_target||[];
 const kpiH=kv.length?`<div class="scroll"><table><tr><th>KPI</th><th>This period</th><th>Last</th><th>Target</th><th></th></tr>${kv.map(r=>`<tr><td>${esc(r.kpi)}</td><td>${esc(r.this_period)}</td><td>${esc(r.last_period)}</td><td>${esc(r.target)}</td><td><span class="chip ${r.status==='good'?'up':r.status==='bad'?'dn':'am'}">${esc(r.status||'')}</span></td></tr>`).join('')}</table></div>`:NA;
 const an=D.anomalies||[];
 const anomH=an.length?an.map(a=>`<div class="ch"><b>${esc(a.title||a.what||a.metric||'')}</b> ${a.change?`<span class="chip am">${esc(a.change)}</span>`:''}<div class="tl">${esc(a.cause||a.likely_cause||'')}${(a.response||a.action)?' → '+esc(a.response||a.action):''}</div></div>`).join(''):'<span class="na">none flagged</span>';
 const nw=D.next_week_priorities||[];
 const nextH=nw.length?`<ol style="margin:0;padding-left:18px">${nw.map(p=>`<li>${esc(typeof p==='string'?p:(p.action||p.text||String(p.priority||"")))}${p&&p.owner?` <span class="tl">· ${esc(p.owner)}</span>`:''}</li>`).join('')}</ol>`:NA;
 const cm=(D.channel_mix||{}).monthly||[];
 const divH=`<div class="sub">Pinterest+TikTok share of spend this window: <b>${num(divNow)?divNow.toFixed(1)+'%':'n/a'}</b> · target <b>TBD</b></div>
 <div class="scroll"><table><tr><th>Month</th><th>Meta</th><th>Google</th><th>Pinterest</th><th>TikTok</th></tr>${cm.map(m=>`<tr><td>${esc(m.month)}</td><td>${m.meta_share_pct}%</td><td>${m.google_share_pct}%</td><td>${m.pinterest_share_pct}%</td><td class="na">—</td></tr>`).join('')}</table></div>
 <div class="tl">Monthly = share of store (UTM) ad-attributed revenue${B('s')}. Shares of spend by month: ${NA}.</div>
 <div class="ch" style="margin-top:8px"><div class="chh"><a href="${L.tiktok}" target="_blank">TikTok test ↗</a><span class="chip nt">not started</span></div><div class="tl">No TikTok spend or orders in data. Budget and pass/fail cost per store order: TBD.</div></div>`;
 detail.push(fold('more','Pacing, KPIs, anomalies, PMax',`<h3 style="margin:0 0 6px;font-size:15px">Spend pacing · ${esc(bp.month||'')}</h3>${pace}<h3 style="margin:14px 0 6px;font-size:15px">Google PMax by campaign</h3>${pmaxHTML()}<h3 style="margin:14px 0 6px;font-size:15px">KPI vs target</h3>${kpiH}<h3 style="margin:14px 0 6px;font-size:15px">Anomalies</h3>${anomH}<h3 style="margin:14px 0 6px;font-size:15px">Next week priorities (full list)</h3>${nextH}<h3 style="margin:14px 0 6px;font-size:15px">Diversification off Meta</h3>${divH}`,false));
 detail.push(fold('alerts',`Spent money, 0 store orders (${zero.length})`,zero.length?`<table><tr><th>Where</th><th>Spend</th><th>Threshold</th></tr>${zero.map(z=>`<tr><td>${esc(z.name)}<div class="tl">${esc(z.lvl)}</div></td><td>${usd(z.spend)}</td><td>${z.lim?usd(z.lim)+' (config)':'$100 default'}</td></tr>`).join('')}</table>`:'No channel or ad over threshold with zero store orders.',false));
 const ac=D.actions||{};
 detail.push(fold('sources','Data sources & freshness',srcs.map(s=>`<div class="src"><span>${s.stale?'🔴':s.manual?'🟡':'🟢'} <b>${esc(s.name)}</b><div class="tl">${esc(s.src)} · ${esc(s.note)}</div></span><span class="tl" style="text-align:right">${esc(s.when)}</span></div>`).join('')+`<div class="src"><span>⚪ <b>TikTok</b><div class="tl">not connected</div></span></div><div class="tl">🔴 stale = data ends &gt;2 days before today · 🟡 manual entry (not a live API). Pinterest manual spend covers only its stated dates; windows starting earlier undercount Pinterest spend. Pinterest API: ${esc(((w.ad_pull_errors||{}).Pinterest)||'no error')}.</div>`,false));
 detail.push(fold('todo','Full to-do list & actions',`<table><tr><th>Item</th><th>Owner</th><th>Due</th></tr>${(D.strategy_todos||[]).map(t=>`<tr><td>${esc(t.action)}</td><td>${esc(t.owner)}</td><td>${esc(t.due)}</td></tr>`).join('')}${(D.next_week_priorities||[]).map(t=>`<tr><td>P${t.priority}: ${esc(t.action)}</td><td>${esc(t.owner)}</td><td>${esc(t.due)}</td></tr>`).join('')}${(ac.watch||[]).map(t=>`<tr><td>Watch ${esc(t.channel)}: ${esc(t.item)}</td><td>${esc(t.owner)}</td><td>${esc(t.due)}</td></tr>`).join('')}</table>`,false));
 const dor=w.daily_orders||{},drv=w.daily_revenue||{};const mx=Math.max(1,...Object.values(dor));
 detail.push(fold('daily','Daily store orders',`<table><tr><th>Day</th><th>Orders${B('s')}</th><th>Revenue</th><th></th></tr>${Object.keys(dor).sort().reverse().map(d=>`<tr><td>${d}</td><td>${dor[d]}</td><td>${usd(drv[d])}</td><td style="width:35%"><div class="bar"><i style="width:${dor[d]/mx*100}%"></i></div></td></tr>`).join('')}</table>`,false));
 detail.push(fold('hist','History (rolling snapshots)',`<div class="scroll"><table><tr><th>Window</th><th>Orders</th><th>Revenue</th><th>Spend</th><th>MER</th></tr>${(D.history_weekly||[]).slice().reverse().map(h=>`<tr><td>${esc(h.label)}</td><td>${n0(h.orders)}</td><td>${usd(h.revenue)}</td><td>${usd(h.ad_spend)}</td><td>${x(h.mer)}</td></tr>`).join('')}</table></div>`,false));
 detail.push(fold('camps','Campaign status (raw)',`<table>${(D.campaign_status||[]).map(c=>`<tr><td><a href="${chLink(c.channel)}" target="_blank">${esc(c.channel)} · ${esc(c.campaign)}</a><div class="tl">${esc(c.key_metric)} · ${esc(c.next_milestone)}</div></td><td>${esc(c.status)}<div class="tl">${usd(c.spend_period)}</div></td></tr>`).join('')}</table>`+
  ((D.meta_shopify_attribution_7d||{}).campaigns?`<h2 style="margin-top:10px">Meta campaigns vs store · ${esc(D.meta_shopify_attribution_7d.window.label)}</h2><table><tr><th>Campaign</th><th>Spend</th><th>Store orders</th><th>Store ROAS</th></tr>${D.meta_shopify_attribution_7d.campaigns.map(c=>`<tr><td>${esc(c.campaign_label)}</td><td>${usd(c.meta_spend)}</td><td>${n0(c.shopify_orders)}</td><td>${x(c.shopify_roas)}</td></tr>`).join('')}</table>`:''),false));
 detail.push(fold('agency','Agency changes log',`<table>${(D.agency_activity||[]).slice().reverse().map(a=>`<tr><td>${esc(a.date)}</td><td style="text-align:left">${esc(a.owner)}: ${esc(a.action)}</td></tr>`).join('')}</table>`,false));
 const os=D.organic_snapshot||{},gf=D.ga4_funnel||{};
 detail.push(fold('conv','Paid vs organic (GA4)',`<div class="sub">GA4 numbers ≠ Shopify. Window: main 30-day window.</div><table><tr><th>Channel</th><th>Sessions</th><th>Purch</th><th>Rev</th></tr>${(os.channels||[]).map(c=>`<tr><td>${esc(c.name)}</td><td>${n0(c.sessions)}</td><td>${n0(c.purchases)}</td><td>${usd(c.revenue)}</td></tr>`).join('')}<tr><td>Paid social</td><td>${n0(gf.paid_social_sessions)}</td><td>${n0(gf.purchases)}</td><td>${NA}</td></tr></table><div class="tl">Paid-social funnel: ${n0(gf.add_to_carts)} ATC → ${n0(gf.checkouts)} checkouts → ${n0(gf.purchases)} purch. Overall conversion rate: ${NA}. <a href="${L.ga}" target="_blank">GA4 ↗</a></div>`,false));
 const r2=(w.director_economics||{}).returns_rollup||k.returns_rollup||{};const ue=k.unit_economics||{};
 detail.push(fold('returns','Returns & unit economics',`<table><tr><td>Refund returns</td><td>${n0(r2.refund_return_orders)}</td></tr><tr><td>Exchanges</td><td>${n0(r2.exchange_orders)}</td></tr><tr><td>Refund cash out</td><td>${usd(r2.refunds_cash_out)}</td></tr><tr><td>Returns cash cost</td><td>${usd(r2.returns_cash_cost)}</td></tr><tr><td>AOV (store)</td><td>${usd(k.aov,2)}</td></tr><tr><td>Discounts</td><td>${usd(ue.discounts)}</td></tr><tr><td>Intl ship-to orders</td><td>${n0(ue.intl_ship_to_orders)}</td></tr><tr><td>Excluded orders (test/cancelled/etc.)</td><td>${n0((w.excluded||{}).orders)}</td></tr><tr><td>Wholesale (not in totals)</td><td>${n0(k.wholesale_orders)} · ${usd(k.wholesale_revenue)}</td></tr></table><div class="tl">New vs returning customers: ${NA}.</div>`,false));
 const ip=D.intl_performance||{};detail.push(fold('intl','International',ip.shopify?`<div class="sub">${esc(ip.label)} vs ${esc(ip.prior_label)}</div><table>${Object.entries(ip.shopify).filter(([a,v])=>num(v)).map(([a,v])=>`<tr><td>${esc(a.replace(/_/g,' '))}</td><td>${/revenue/.test(a)?usd(v):n0(v)}</td></tr>`).join('')}</table>`:NA,false));
 detail.push(fold('gloss','Glossary',`<table>${Object.entries(D.glossary||{}).map(([a,b])=>`<tr><td><b>${esc(a)}</b></td><td style="text-align:left">${esc(b)}</td></tr>`).join('')}</table>`,false));
 out.push(mapSection(5,'Full detail (for Andrew)',`<div class="sec5-wrap"><p class="sub" style="margin-top:0">Tap any row for per-ad tables, pacing, anomalies, data freshness, and glossary. Closed by default.</p>${detail.join('')}</div>`));
 $('#app').innerHTML=out.join('');
}
function sources(){const dq=D.data_quality||{},w=(D.windows||{})[W==='30d'?'30':'7']||{},as=w.ad_source_status||{};const today=D.window?.end;const res=[];
 const add=(name,src,note,end,pulled)=>{const age=daysAgo(end);res.push({name,src,manual:/manual/i.test(src||''),note:note||'',stale:age==null?true:age>2,when:`data through ${end||'unknown'}${pulled?' · pulled '+fmtT(pulled):''}`})};
 add('Shopify (store truth)',dq.shopify?.source,dq.shopify?.note,today,dq.shopify?.pulled_at);
 add('Meta (platform)',dq.meta?.source,'',dq.meta?.last_live_through,dq.meta?.pulled_at);
 add('Google via GA4 (platform)',dq.google?.source,'',dq.google?.last_live_through,dq.google?.pulled_at);
 const pn=as.Pinterest?.note||'';const m=null;
 add('Pinterest (platform, manual Blend)',as.Pinterest?.source||dq.pinterest?.source,`${pn} · manual Blend spend`,m?m[1]:dq.pinterest?.last_live_through,null);
 add('GA4 (direction only)',dq.ga4?.source,'',dq.ga4?.pulled_at?.slice(0,10),dq.ga4?.pulled_at);
 const mc=D.meta_ads_by_creative?.window;add('Meta ads by creative',D.meta_ads_by_creative?.source_note,'yesterday + last 7 complete days',mc?.end,null);
 return res}
load();setInterval(load,15*60*1000);
