<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paid Ads</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--g:#047857;--gb:#d1fae5;--r:#b91c1c;--rb:#fee2e2;--a:#92400e;--ab:#fef3c7;--b:#1d4ed8;--bb:#dbeafe}
[data-theme=dark]{--bg:#0b0f17;--card:#151b26;--tx:#e5e7eb;--mu:#9ca3af;--bd:#273042;--g:#34d399;--gb:#06281d;--r:#f87171;--rb:#3a1414;--a:#fbbf24;--ab:#33260a;--b:#93c5fd;--bb:#10223f}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
a{color:var(--b);text-decoration:none}header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}h1{font-size:16px;margin:0;flex:1}
button,.seg button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 10px;font-size:13px}
.seg{display:flex}.seg button{border-radius:0}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}.seg button.on{background:var(--tx);color:var(--card)}
.asof{font-size:12px;color:var(--mu);margin-top:4px}main{padding:12px;max-width:900px;margin:auto}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}.tile{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.tl{font-size:12px;color:var(--mu)}.tv{font-size:22px;font-weight:700;margin:2px 0}.chip{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;white-space:nowrap}
.up{background:var(--gb);color:var(--g)}.dn{background:var(--rb);color:var(--r)}.nt{background:var(--bd);color:var(--mu)}.am{background:var(--ab);color:var(--a)}.bl{background:var(--bb);color:var(--b)}
.badge{font-size:10px;text-transform:uppercase;letter-spacing:.03em;padding:1px 5px;border-radius:4px;margin-left:4px}.store{background:var(--gb);color:var(--g)}.plat{background:var(--ab);color:var(--a)}
.todos{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 10px}.todos a{flex:0 1 auto;max-width:100%;font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.todos a.red{border-color:var(--r);color:var(--r)}.todos a.amb{border-color:var(--a);color:var(--a)}
h2{font-size:15px;margin:0 0 8px}.sub{font-size:12px;color:var(--mu);margin:-4px 0 8px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:right;vertical-align:top}th:first-child,td:first-child{text-align:left}th{font-size:11px;color:var(--mu);font-weight:600}
.scroll{overflow-x:auto}.ch{border-top:1px solid var(--bd);padding:10px 0}.ch:first-of-type{border-top:0}.chh{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}.kv div{font-size:12px;color:var(--mu)}.kv b{display:block;font-size:15px;color:var(--tx)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;position:relative;margin:4px 0}.bar i{display:block;height:100%;background:var(--b)}.bar i.over{background:var(--r)}.bar s{position:absolute;top:0;bottom:0;width:2px;background:var(--tx)}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:10px}summary{padding:12px;font-weight:600;cursor:pointer}details>div{padding:0 12px 12px}
.note{font-size:12px;padding:8px;border-radius:8px;background:var(--ab);color:var(--a);margin:6px 0}.na{color:var(--mu);font-style:italic}.pin{background:var(--bb)}
.src{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--bd);padding:6px 0;font-size:13px}.err{color:var(--r);padding:20px}
.dec{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}.dcard{border:1px solid var(--bd);border-radius:10px;padding:10px}
.dcard h3{font-size:14px;margin:0 0 4px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;align-items:center}.dcard table{font-size:12px}.dline{font-size:13px;margin-top:6px}.dline b{font-weight:700}
.legend button.on{background:var(--tx);color:var(--card)}.legend button{border-radius:999px;padding:4px 10px}.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.legend .chip{white-space:normal}.tot td{font-weight:700;border-top:2px solid var(--bd)}
</style></head><body>
<header><div class="row"><h1>Paid Ads</h1>
<div class="seg" id="win"><button data-w="today">Today</button><button data-w="yesterday">Yesterday</button><button data-w="7d">7d</button><button data-w="30d">30d</button></div>
<button id="reload" title="Reload">⟳</button><button id="theme" title="Dark mode">◐</button></div>
<div class="asof" id="asof">Loading…</div></header>
<main id="app"></main>
<script>
const ACT='10152741884925238',SHOP='barreletics';
const L={meta:`https://adsmanager.facebook.com/adsmanager/manage/campaigns?act=${ACT}`,metaAds:`https://adsmanager.facebook.com/adsmanager/manage/ads?act=${ACT}`,google:'https://ads.google.com/aw/campaigns',pin:'https://ads.pinterest.com/',tiktok:'https://ads.tiktok.com/',shop:`https://admin.shopify.com/store/${SHOP}/orders`,ga:'https://analytics.google.com/analytics/web/',old:'../'};
const order=n=>`https://admin.shopify.com/store/${SHOP}/orders?query=${encodeURIComponent(String(n).replace('#',''))}`;
const chLink=n=>/meta/i.test(n)?L.meta:/google/i.test(n)?L.google:/pinterest/i.test(n)?L.pin:/tiktok/i.test(n)?L.tiktok:L.shop;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>typeof v==='number'&&isFinite(v);
const NA='<span class="na">not available</span>';
const usd=(v,d=0)=>num(v)?'$'+v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}):NA;
const x=v=>num(v)?v.toFixed(2)+'×':NA,n0=v=>num(v)?v.toLocaleString('en-US'):NA;
const B=t=>t==='s'?'<span class="badge store">store</span>':'<span class="badge plat">platform</span>';
const fmtT=s=>{if(!s)return null;const d=new Date(s);return isNaN(d)?s:d.toLocaleString('en-US',{timeZone:'America/Detroit',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' ET'};
const daysAgo=ds=>{if(!ds)return null;return Math.floor((Date.now()-new Date(ds+'T12:00:00-04:00'))/864e5)};
function chip(cur,prev,good='up',label){if(!num(cur)||!num(prev)||prev===0)return '<span class="chip nt">no prior</span>';const p=(cur-prev)/Math.abs(prev)*100;const better=good==='up'?p>=0:p<=0;return `<span class="chip ${Math.abs(p)<1?'nt':better?'up':'dn'}">${p>=0?'▲':'▼'} ${Math.abs(p).toFixed(0)}% ${label}</span>`}
let D=null,W=localStorage.getItem('v2win2')||'7d',F='all';if(!['today','yesterday','7d','30d'].includes(W))W='7d';
const th=localStorage.getItem('v2theme');if(th==='dark')document.documentElement.dataset.theme='dark';
$('#theme').onclick=()=>{const d=document.documentElement;const dark=d.dataset.theme!=='dark';if(dark)d.dataset.theme='dark';else delete d.dataset.theme;localStorage.setItem('v2theme',dark?'dark':'light')};
$('#reload').onclick=()=>load(true);
document.querySelectorAll('#win button').forEach(b=>b.onclick=()=>{W=b.dataset.w;localStorage.setItem('v2win2',W);render()});
async function load(){try{const r=await fetch('../data/latest.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);D=await r.json();render()}catch(e){$('#app').innerHTML=`<div class="err">Could not load data/latest.json: ${esc(e.message)}</div>`}}
function sec(id,title,html,open){return `<details id="${id}"${open?' open':''}><summary>${title}</summary><div>${html}</div></details>`}
const todayET=()=>new Date().toLocaleDateString('en-CA',{timeZone:'America/Detroit'});
const yesterdayET=()=>{const d=new Date(todayET()+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10)};
const WL={today:'Today',yesterday:'Yesterday','7d':'Last 7 days','30d':'Last 30 days'};
function blk(c){return (c||{})[W]||{}}
function asofHTML(){const m=(D.ad_decisions||{}).meta||{};const b=blk(m);const lab=(b.window||{}).label||'';
 return `<b>${WL[W]}</b> · ${esc(lab)}${W==='today'?` · <span class="chip am">partial, as of ${fmtT(m.as_of||D.generated_at)}</span>`:''} · data as of ${fmtT(D.generated_at)||'unknown'} · <a href="${L.old}">old page</a>`}
const money=v=>'$'+Math.round(v).toLocaleString('en-US');
function decide(r,T){T=T||{};const sp=r.spend||0,o=r.orders||0,S=r.S??0,M=r.M;const pct=T.winner_budget_step_pct??20,lo=T.cut_pct_low??30,hi=T.cut_pct_high??50;let d;
 const bud=r.budget,used=r.usedPerDay;
 if(sp>=(T.pause_spend_no_orders??100)&&o===0)d=['dn','loser','pause','loss'];
 else if(sp>=(T.losing_min_spend??150)&&o<(T.losing_max_orders??2)&&S<(T.breakeven_roas??0.9))d=['dn','losing',`cut ${lo}–${hi}%${bud?` (${money(bud)} → ${money(bud*(1-hi/100))}–${money(bud*(1-lo/100))}/day)`:''} or pause`,'loss'];
 else if(sp<(T.min_spend_for_call??50)||o<(T.min_orders_for_call??2))d=['nt','too early','hold','early'];
 else if(S>=(T.winner_roas??1.6)){let a=bud?`add ${pct}% budget (${money(bud)} → ${money(bud*(1+pct/100))}/day)`:`add ${pct}% budget (budget unknown)`;
   if(bud&&num(used)){if(used<bud*(T.underspend_ratio??0.8))a=`budget has room: spending ${money(used)}/day of ${money(bud)}/day — no raise needed yet`;else if(used>=bud*(T.budget_limited_ratio??0.9))a+=` — budget-limited (spending ${money(used)}/day), raise budget`}
   d=['up','winner',a,'win']}
 else if(S>=(T.profitable_roas??1.2))d=['bl','profitable','hold / scale slowly','ok'];
 else if(S>=(T.breakeven_roas??0.9))d=['am','break-even','add 2–3 new creatives, keep budget','ok'];
 else d=['dn','losing',`cut ${lo}–${hi}%${bud?` (${money(bud)} → ${money(bud*(1-hi/100))}–${money(bud*(1-lo/100))}/day)`:''} or pause`,'loss'];
 const over=num(M)&&S>0?M/S:null;const ov=over!=null&&over>(T.overstate_ratio??2);
 return {chip:d[0],label:d[1],action:d[2],grp:d[3],act:['win','loss'].includes(d[3]),over,ov,small:d[3]==='early'&&W!=='7d'}}
const says=(p,roas,u='purch')=>`${num(p)?(+p).toLocaleString('en-US',{maximumFractionDigits:1}):'0'} ${u} · ${x(roas)}`;
function cardItems(){const A=D.ad_decisions||{},T=A.thresholds||{},items=[];
 const m=A.meta||{},b=blk(m),my=Object.fromEntries((((m.yesterday)||{}).rows||[]).map(r=>[r.ad,r]));
 const r7m=Object.fromEntries((((m['7d'])||{}).rows||[]).map(r=>[r.ad,r]));
 (b.rows||[]).filter(r=>(r.meta_spend||0)>=(W==='7d'||W==='30d'?5:1)).forEach(r=>{const r7=r7m[r.ad]||r;items.push({name:r.ad,kind:'Meta ad',plat:'Meta',sub:r.ad_set,r,spend:r.meta_spend,orders:r.shopify_orders,S:r.shopify_roas,M:r.meta_roas,p:r.meta_claims_purch,
   budget:r7.daily_budget,usedPerDay:r7.budget_avg_daily_spend_7d,budNote:(r7.budgets||[]).map(x=>`${x.level} "${x.name}" ${money(x.daily_budget)}/day${x.shared_with_creatives>1?` shared by ${x.shared_with_creatives} creatives`:''}`).join('; ')})});
 for(const [key,kind,plat] of [['pmax','Google PMax','Google'],['pinterest','Pinterest','Pinterest']]){const c=A[key]||{};const r7=Object.fromEntries((((c['7d'])||{}).rows||[]).map(r=>[r.ad,r]));
   (blk(c).rows||[]).filter(r=>(r.spend||0)>0).forEach(r=>{const w7=r7[r.ad];items.push({name:r.ad,kind,plat,r,spend:r.spend,orders:r.shopify_orders,S:r.shopify_roas,M:r.platform_roas,p:r.platform_purch,
   budget:c.daily_budget,usedPerDay:w7?w7.spend/7:null,budNote:c.daily_budget?`${c.budget_note||'budget'} ${money(c.daily_budget)}/day (config)`:''})})}
 items.forEach(it=>it.d=decide(it,T));const rank={loss:0,win:1,ok:2,early:3};items.sort((a,b)=>rank[a.d.grp]-rank[b.d.grp]||b.spend-a.spend);return items}
function decisionsHTML(){const A=D.ad_decisions||{},T=A.thresholds||{},m=A.meta||{},y=yesterdayET();const b=blk(m);const items=cardItems();
 const show=items.filter(it=>F==='all'||(F==='act'&&it.d.act)||(F==='win'&&it.d.grp==='win')||(F==='loss'&&it.d.grp==='loss'));
 const cards=show.map(it=>{const d=it.d,r=it.r,gap=num(it.p)&&num(it.orders)?it.p-it.orders:null;
   const real=`${it.plat} claims ${num(it.p)?+it.p.toFixed?.(1)||it.p:0} purch at ${x(it.M)}; store saw ${it.orders||0} order${it.orders===1?'':'s'} at ${x(it.S)}`+(gap!=null&&gap>0?` (gap +${+gap.toFixed(1)}${d.over?`, ${d.over.toFixed(1)}× overstated`:''})`:'')+'.';
   return `<div class="dcard"><h3><span>${esc(it.name)} <span class="tl">${esc(it.kind)}${it.sub?' · '+esc(it.sub):''}</span></span><span><span class="chip ${d.chip}">${esc(d.label)}</span>${d.small?' <span class="chip nt">small sample</span>':''}</span></h3>
   <table><tr><th>Spend</th><th>${esc(it.plat)} says</th><th>Shopify shows</th></tr><tr><td style="text-align:left">${usd(it.spend,2)}</td><td>${says(it.p,it.M)}</td><td>${says(it.orders,it.S,it.orders===1?'order':'orders')}</td></tr></table>
   <div class="dline"><b>Reality:</b> ${esc(real)}</div><div class="dline"><b>Decision:</b> ${esc(it.name)}: ${esc(d.label)}, ${esc(d.action)}${d.ov?`. ${esc(it.plat)} overstating, trust store`:''}.</div>${it.budNote?`<div class="tl" style="margin-top:4px">Budget: ${esc(it.budNote)}</div>`:''}</div>`}).join('');
 const wy=(m.yesterday||{}).window||{};
 const stale=wy.end&&wy.end!==y?`<div class="note">⚠ Per-ad data ends ${esc(wy.end)}; expected ${y}. Refresh may be failing.</div>`:(!m.yesterday?`<div class="note">⚠ Per-ad Meta data missing${A.errors&&A.errors.meta?': '+esc(A.errors.meta):''}.</div>`:'');
 const pinMiss=(blk(A.pinterest).missing_spend_days)||[];
 const cnt=f=>items.filter(it=>f==='all'||(f==='act'&&it.d.act)||(f==='win'&&it.d.grp==='win')||(f==='loss'&&it.d.grp==='loss')).length;
 const flt=`<div class="legend" id="flt">${[['all','All'],['act','Act now'],['win','Winners'],['loss','Losers']].map(([k,l])=>`<button data-f="${k}" class="${F===k?'on':''}">${l} (${cnt(k)})</button>`).join('')}</div>`;
 const lg=`<div class="legend">${[['dn',`≥$${T.pause_spend_no_orders??100} & 0 orders → pause`],['dn',`≥$${T.losing_min_spend??150}, <${T.losing_max_orders??2} orders, ROAS <${T.breakeven_roas??0.9} → losing`],['nt',`<$${T.min_spend_for_call??50} or <${T.min_orders_for_call??2} orders → hold`],['up',`store ROAS ≥${T.winner_roas??1.6} → +${T.winner_budget_step_pct??20}% budget`],['bl',`${T.profitable_roas??1.2}–${T.winner_roas??1.6} → hold / scale slowly`],['am',`${T.breakeven_roas??0.9}–${T.profitable_roas??1.2} → 2–3 new creatives`],['dn',`<${T.breakeven_roas??0.9} → cut ${T.cut_pct_low??30}–${T.cut_pct_high??50}%`]].map(([c,t])=>`<span class="chip ${c}">${esc(t)}</span>`).join('')}</div>`;
 const acts=items.map(it=>`<li class="${it.d.act?'':'tl'}"><span class="chip ${it.d.chip}">${esc(it.d.label)}</span> ${esc(it.name)}: ${esc(it.d.action)}${it.d.small?' (small sample)':''}</li>`).join('');
 return `<div class="card" id="decisions"><h2>Decisions · ${esc(WL[W])} (${esc((b.window||{}).label||'n/a')})</h2><div class="sub">One card per active ad. Rules use <b>Shopify (store) ROAS</b> for the selected window; 7d is the default call.</div>${stale}${pinMiss.length?`<div class="note">Pinterest spend missing for ${pinMiss.join(', ')} (manual Blend).</div>`:''}
 ${flt}<div style="height:8px"></div>${cards?`<div class="dec">${cards}</div>`:'<span class="na">no ads in this filter</span>'}${lg}</div>
 <div class="card" id="actions"><h2>Action items</h2><ol style="margin:0;padding-left:18px;line-height:1.9">${acts||'<span class="na">none</span>'}</ol></div>`}
function saysTableHTML(){const A=D.ad_decisions||{},m=A.meta||{};const b=blk(m),rows=b.rows||[],t=b.totals||{},y=yesterdayET();
 const tr=(r,cls='')=>`<tr class="${cls}"><td>${cls?'<b>Total</b>':`<a href="${L.metaAds}" target="_blank">${esc(r.ad)}</a><div class="tl">${esc(r.ad_set||'')}</div>`}</td><td>${usd(r.meta_spend,2)}</td><td>${n0(r.meta_claims_purch)}</td><td>${usd(r.meta_cpa,2)}</td><td>${x(r.meta_roas)}</td><td>${r.shopify_orders&&r.order_names?`<a href="${order(r.order_names[0])}" target="_blank">${r.shopify_orders}</a>`:n0(r.shopify_orders)}</td><td>${usd(r.shopify_cpa,2)}</td><td>${x(r.shopify_roas)}</td><td>${num(r.meta_claims_purch)&&num(r.shopify_orders)?((r.meta_claims_purch-r.shopify_orders)>0?'+':'')+(r.meta_claims_purch-r.shopify_orders):NA}</td></tr>`;
 const end=(m.yesterday||{}).window?.end;const stale=!end?'<div class="note">⚠ No per-ad data in latest.json.</div>':end!==y?`<div class="note">⚠ Stale: data ends ${esc(end)}, expected ${y}.</div>`:'';
 return `<div class="card" id="says"><h2>Meta says vs Shopify shows · ${esc(WL[W])}</h2>
 <div class="sub">${esc((b.window||{}).label||'')}${W==='today'?' (partial)':''} · Meta = platform-claimed${B('p')} · Shopify = last-visit utm_content${B('s')}</div>${stale}
 <div class="scroll"><table><tr><th>Ad</th><th>Spend</th><th>Meta purch</th><th>Meta CPA</th><th>Meta ROAS</th><th>Shopify orders</th><th>Shopify CPA</th><th>Shopify ROAS</th><th>Gap</th></tr>${rows.map(r=>tr(r)).join('')}${rows.length?tr(t,'tot'):''}</table></div></div>`}
function tilesHTML(){const A=D.ad_decisions||{},b=blk(A.meta),w=b.window||{};let sp=(b.totals||{}).meta_spend||0,tag=(b.totals||{}).shopify_revenue||0;
 for(const k of ['pmax','pinterest'])(blk(A[k]).rows||[]).forEach(r=>{sp+=r.spend||0;tag+=r.shopify_revenue||0});
 let all=0;const dr=D.daily_revenue||{};Object.keys(dr).forEach(d=>{if(w.start&&d>=w.start&&d<=w.end)all+=dr[d]});
 const tile=(l,v,bd,sub)=>`<div class="tile"><div class="tl">${l}${bd}</div><div class="tv">${v}</div><div class="tl">${sub}</div></div>`;
 return `<div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${tile('Paid ROAS',x(sp?tag/sp:null),B('s'),`ad-tagged store sales ${usd(tag)} ÷ spend`)}${tile('Halo ROAS',x(sp?all/sp:null),B('s'),`all store revenue ${usd(all)} ÷ spend`)}${tile('Total ad spend',usd(sp),B('p'),'Meta + PMax + Pinterest')}</div><div class="sub" style="margin:6px 0 10px">${esc(WL[W])} · ${esc(w.label||'')}${W==='today'?' (partial)':''}</div>`}
function pmaxHTML(){const p=(D.ad_decisions||{}).pmax||{},b=p[W]||{};if(!b.rows)return NA;
 return `<div class="sub">${esc(b.window?.label||'')} · ${esc(p.source||'')}${p.error?' · error: '+esc(p.error):''}</div><div class="scroll"><table><tr><th>Campaign</th><th>Spend</th><th>Google conv</th><th>Google ROAS</th><th>Shopify orders</th><th>Shopify CPA</th><th>Shopify ROAS</th></tr>${b.rows.map(r=>`<tr><td>${esc(r.ad)}</td><td>${usd(r.spend,2)}</td><td>${n0(r.platform_purch)}</td><td>${x(r.platform_roas)}</td><td>${n0(r.shopify_orders)}</td><td>${usd(r.shopify_cpa,2)}</td><td>${x(r.shopify_roas)}</td></tr>`).join('')}</table></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('#flt button');if(b){F=b.dataset.f;render()}});
function render(){
 document.querySelectorAll('#win button').forEach(b=>b.classList.toggle('on',b.dataset.w===W));

function sources(){const dq=D.data_quality||{},w=(D.windows||{})[W==='30d'?'30':'7']||{},as=w.ad_source_status||{};const today=D.window?.end;const res=[];
 const add=(name,src,note,end,pulled)=>{const age=daysAgo(end);res.push({name,src,manual:/manual/i.test(src||''),note:note||'',stale:age==null?true:age>2,when:`data through ${end||'unknown'}${pulled?' · pulled '+fmtT(pulled):''}`})};

 add('Meta (platform)',dq.meta?.source,'',dq.meta?.last_live_through,dq.meta?.pulled_at);

 const mc=D.meta_ads_by_creative?.window;add('Meta ads by creative',D.meta_ads_by_creative?.source_note,'yesterday + last 7 complete days',mc?.end,null);
 return res}
