name: Refresh rolling dashboard

on:
  schedule:
    # Off the hour — GitHub often skips/delays :00 cron.
    - cron: '23 * * * *'
  workflow_dispatch:

concurrency:
  group: dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Refresh Shopify rolling window
        id: refresh
        continue-on-error: true
        env:
          SHOPIFY_DOMAIN: ${{ secrets.SHOPIFY_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: act_10152741884925238
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_AD_ACCOUNT_ID: ${{ secrets.PINTEREST_AD_ACCOUNT_ID }}
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          GA_PROPERTY_ID: '300437005'
        run: python3 refresh_rolling.py
      - name: Rebuild standalone report
        run: python3 build_standalone.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json data/ad_spend data/refresh_status.json data/meta_halo_trend.json report.html
          git diff --staged --quiet || git commit -m "Refresh rolling window data"
          git push
      - name: Fail job if required ad sources failed
        if: always()
        run: |
          if [ -f data/refresh_status.json ]; then
            python3 -c "import json,sys; s=json.load(open('data/refresh_status.json')); sys.exit(0 if s.get('ok') else 1)"
          elif [ "${{ steps.refresh.outcome }}" != "success" ]; then
            echo "Refresh step failed and no refresh_status.json was written"
            exit 1
          fi
