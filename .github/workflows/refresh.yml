name: Refresh rolling dashboard

on:
  schedule:
    - cron: '0 12 * * *'   # 8am ET (DST varies)
    - cron: '0 0 * * *'    # 8pm ET previous day UTC ≈ evening ET
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh Shopify rolling window
        env:
          SHOPIFY_DOMAIN: ${{ secrets.SHOPIFY_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python3 refresh_rolling.py
      - name: Rebuild standalone report
        run: python3 build_standalone.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json report.html
          git diff --staged --quiet || git commit -m "Refresh rolling window data"
          git push
